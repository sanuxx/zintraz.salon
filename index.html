const dayDiff=(a,z)=>Math.round((new Date(z+'T12:00')-new Date(a+'T12:00'))/864e5)+1;
const niceTop=(v,int)=>{if(v<=0)return int?4:4;const q=v/4,mag=Math.pow(10,Math.floor(Math.log10(q)));return (int?Math.max(1,Math.ceil(q)):[1,1.5,2,2.5,3,4,5,6,8,10].find(z=>z*mag>=q-1e-9)*mag)*4};

function anBuckets(from,to){
 const days=dayDiff(from,to),g=days<=31?'d':days<=140?'w':'m',b=[];
 if(g==='d')for(let i=0;i<days;i++){const d=addDays(from,i);b.push({l:days<=14?fdow(d)+' '+fday(d):fdate(d).slice(0,-6),f:d,t:d,full:fdow(d)+', '+fdate(d)})}
 else if(g==='w'){let s=monday(from);while(s<=to){const e=addDays(s,6);b.push({l:fdate(s).slice(0,-6),f:s<from?from:s,t:e>to?to:e,full:'Week of '+fdate(s)});s=addDays(s,7)}}
 else{let m=from.slice(0,7);while(m<=to.slice(0,7)){const dd=new Date(m+'-01T12:00');b.push({l:dd.toLocaleDateString('en-US',{month:'short'}),f:m+'-01'<from?from:m+'-01',t:m+'-31'>to?to:m+'-31',full:dd.toLocaleDateString('en-US',{month:'long',year:'numeric'})});m=nextMonth(m)}}
 return{days,g,b}}

/* ----- chart primitives (SVG, shared tooltip from the dashboard) ----- */
let _cid=0;
function chartGrid(L,R,W,H,Tp,B,ticks,y,fmt){return ticks.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join('')}
function areaChart(labels,series,o={}){
 const id='ag'+(++_cid),W=720,H=260,L=50,R=14,Tp=16,B=30,fmt=o.axis||cmpct,mx=niceTop(Math.max(...series.flatMap(s=>s.v),1),o.int),n=labels.length;
 const x=i=>L+(n>1?i/(n-1):.5)*(W-L-R),y=v=>Tp+(1-v/mx)*(H-Tp-B),bw=(W-L-R)/Math.max(n-1,1),step=Math.ceil(n/9);
 const path=v=>v.map((p,i)=>{if(!i)return `M${x(0).toFixed(1)} ${y(p).toFixed(1)}`;const m=((x(i-1)+x(i))/2).toFixed(1);return `C${m} ${y(v[i-1]).toFixed(1)} ${m} ${y(p).toFixed(1)} ${x(i).toFixed(1)} ${y(p).toFixed(1)}`}).join('');
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Trend chart')}"><defs>${series.map((s,k)=>`<linearGradient id="${id}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${s.dash?0:.3}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>
 ${chartGrid(L,R,W,H,Tp,B,[0,1,2,3,4].map(k=>mx/4*k),y,fmt)}
 ${series.map((s,k)=>`${s.dash?'':`<path d="${path(s.v)} L${x(n-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z" fill="url(#${id}${k})"/>`}<path d="${path(s.v)}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.8:2.6}" stroke-linecap="round" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 5" opacity=".75"':''}/>`).join('')}
 ${labels.map((l,i)=>{const tip=`${esc(o.full?o.full[i]:l)}`+series.map(s=>`<span class="tpl"><i style="background:${s.color}"></i>${esc(s.name)}<b>${s.f(s.v[i])}</b></span>`).join('');
  return `<g class="hv" data-tip="${esc(tip)}" data-x="${(x(i)/W*100).toFixed(2)}" data-y="${(Math.min(...series.map(s=>y(s.v[i])))/H*100).toFixed(2)}"><rect x="${x(i)-bw/2}" y="0" width="${bw}" height="${H-B}"/><line class="gd" x1="${x(i)}" x2="${x(i)}" y1="${Tp}" y2="${H-B}"/>${series.map(s=>`<circle class="pt" cx="${x(i)}" cy="${y(s.v[i])}" r="4.5" style="stroke:${s.color}"/>`).join('')}</g>${i%step===0?`<text x="${x(i)}" y="${H-9}" text-anchor="middle">${esc(l)}</text>`:''}`}).join('')}
 </svg><div class="ctip" role="status"></div></div>`}
function barChart(labels,series,o={}){
 const W=720,H=260,L=50,R=14,Tp=16,B=30,fmt=o.axis||cmpct,all=series.flatMap(s=>s.v),top=niceTop(Math.max(...all,0),o.int),lo=Math.min(0,...all),bot=lo<0?-niceTop(-lo,o.int):0;
 const y=v=>Tp+(1-(v-bot)/(top-bot))*(H-Tp-B),n=labels.length,gw=(W-L-R)/n,bwid=Math.min(34,gw*.72/series.length),step=Math.ceil(n/12);
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Bar chart')}">${chartGrid(L,R,W,H,Tp,B,[0,1,2,3,4].map(k=>bot+(top-bot)*k/4),y,fmt)}${bot<0?`<line class="zero" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`:''}
 ${labels.map((l,i)=>{const cx=L+gw*(i+.5),tip=`${esc(o.full?o.full[i]:l)}`+series.map(s=>`<span class="tpl"><i style="background:${s.color}"></i>${esc(s.name)}<b>${s.f(s.v[i])}</b></span>`).join('');
  return `<g class="hv" data-tip="${esc(tip)}" data-x="${(cx/W*100).toFixed(2)}" data-y="${(Math.min(...series.map(s=>y(Math.max(s.v[i],0))))/H*100).toFixed(2)}"><rect x="${L+gw*i}" y="0" width="${gw}" height="${H-B}"/>${series.map((s,k)=>{const bx=cx-bwid*series.length/2+bwid*k,v=s.v[i],y1=y(Math.max(v,0)),y2=y(Math.min(v,0));return `<rect class="bar" x="${(bx+1.5).toFixed(1)}" y="${y1.toFixed(1)}" width="${(bwid-3).toFixed(1)}" height="${Math.max(2,y2-y1).toFixed(1)}" rx="4" style="fill:${s.color}"/>`}).join('')}</g>${i%step===0?`<text x="${cx}" y="${H-9}" text-anchor="middle">${esc(l)}</text>`:''}`}).join('')}
 </svg><div class="ctip" role="status"></div></div>`}
const legend=s=>`<div class="lgd">${s.map(x=>`<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`;
function hbars(items,max){const m=max||Math.max(...items.map(i=>i.v),1);return `<div class="hbl">${items.map((it,i)=>`<div class="hbi"><div class="hbt"><span>${esc(it.n)}</span><b>${it.fv}</b></div><div class="hbtr"><i style="width:${Math.max(2,it.v/m*100).toFixed(1)}%;background:${it.color||PAL[i%PAL.length]}"></i></div>${it.sub?`<small>${it.sub}</small>`:''}</div>`).join('')||empty('No data in this period')}</div>`}
function donut2(items,fmt,centre,sub){const tot=sum(items,i=>i.v);if(!tot)return empty('No data in this period');const R=46,C=2*Math.PI*R;let off=0;
 const segs=items.map((it,i)=>{const f=it.v/tot,s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${it.color||PAL[i%PAL.length]}" stroke-width="15" stroke-dasharray="${Math.max(0,f*C-1.5).toFixed(2)} ${(C-Math.max(0,f*C-1.5)).toFixed(2)}" stroke-dashoffset="${(-off*C).toFixed(2)}" transform="rotate(-90 60 60)" stroke-linecap="butt"><title>${esc(it.n)}: ${fmt(it.v)} (${Math.round(f*100)}%)</title></circle>`;off+=f;return s}).join('');
 return `<div class="donutw"><svg width="150" height="150" viewBox="0 0 120 120" role="img"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--bg2)" stroke-width="15"/>${segs}<text x="60" y="${sub?57:64}" text-anchor="middle" style="font:700 15px var(--f1);fill:var(--text)">${centre}</text>${sub?`<text x="60" y="73" text-anchor="middle" style="font:500 9.5px var(--f2);fill:var(--muted)">${sub}</text>`:''}</svg>
 <div class="legend">${items.map((it,i)=>`<div><i style="background:${it.color||PAL[i%PAL.length]}"></i>${esc(it.n)}<b>${fmt(it.v)} · ${Math.round(it.v/tot*100)}%</b></div>`).join('')}</div></div>`}

/* ----- the analytics page ----- */
function akpi(col,ico,label,val,foot,sp){return `<div class="card hov kpi c-${col}"><div class="kh"><span class="kic">${ic(ico)}</span>${label}</div><div class="kv">${val}</div><div class="kf">${foot}</div>${sp||''}</div>`}
function analytics(){
 const u=S.ui,from=u.repFrom,to=u.repTo,{days,g,b}=anBuckets(from,to),pf=addDays(from,-days),pt=addDays(from,-1);
 const all=live(),cur=all.filter(i=>within(i.date,from,to)),prv=all.filter(i=>within(i.date,pf,pt));
 const rev=sum(cur,sales),pRev=sum(prv,sales),exp=sum(S.expenses.filter(e=>within(e.date,from,to)),e=>e.amt),pExp=sum(S.expenses.filter(e=>within(e.date,pf,pt)),e=>e.amt);
 const ap=S.appts.filter(a=>within(a.date,from,to)),pap=S.appts.filter(a=>within(a.date,pf,pt));
 const booked=ap.filter(a=>!inactive(a)).length,pBooked=pap.filter(a=>!inactive(a)).length;
 const stc=k=>ap.filter(a=>a.status===k).length,done=stc('Completed'),canc=stc('Cancelled'),nos=stc('No-show');
 const rate=a=>{const d=a.filter(x=>x.status==='Completed').length,r=a.filter(x=>['Completed','Cancelled','No-show'].includes(x.status)).length;return r?Math.round(d/r*100):0};
 const nsRate=a=>{const n=a.filter(x=>x.status==='No-show').length,d=a.filter(x=>x.status==='Completed').length;return n+d?Math.round(n/(n+d)*100):0};
 const ticket=cur.length?rev/cur.length:0,pTicket=prv.length?pRev/prv.length:0;
 const newC=S.customers.filter(c=>within(c.joined,from,to)).length,pNewC=S.customers.filter(c=>within(c.joined,pf,pt)).length;
 const vals=(fn)=>b.map(x=>fn(x.f,x.t));
 const revIn=(a,z)=>sum(all.filter(i=>within(i.date,a,z)),sales),expIn=(a,z)=>sum(S.expenses.filter(e=>within(e.date,a,z)),e=>e.amt),apIn=(a,z)=>S.appts.filter(x=>within(x.date,a,z)&&!inactive(x)).length;
 const revS=vals(revIn),prevS=vals((a,z)=>revIn(addDays(a,-days),addDays(z,-days)));
 /* categories */
 const cat={};cur.forEach(i=>i.items.forEach(x=>{const s=x.type==='svc'&&S.services.find(z=>z.id==x.ref),k=x.type==='svc'?(s?.cat||'Services'):x.type==='prod'?'Retail products':'Packages & gifts';cat[k]=(cat[k]||0)+x.price*x.qty}));
 const cats=Object.entries(cat).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
 const svcR={},svcN={};cur.forEach(i=>i.items.filter(x=>x.type==='svc').forEach(x=>{svcR[x.name]=(svcR[x.name]||0)+x.price*x.qty;svcN[x.name]=(svcN[x.name]||0)+x.qty}));
 const topSvc=Object.entries(svcR).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([n,v],i)=>({n,v,fv:money(v),sub:svcN[n]+' booked · avg '+money(v/svcN[n])}));
 const prodR={},prodN={};cur.forEach(i=>i.items.filter(x=>x.type==='prod').forEach(x=>{prodR[x.name]=(prodR[x.name]||0)+x.price*x.qty;prodN[x.name]=(prodN[x.name]||0)+x.qty}));
 const topProd=Object.entries(prodR).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,v])=>({n,v,fv:money(v),sub:prodN[n]+' sold'}));
 /* payments */
 const pay={};all.forEach(i=>i.payments.filter(p=>within(p.date,from,to)).forEach(p=>pay[p.method]=(pay[p.method]||0)+p.amt));
 const pays=Object.entries(pay).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
 /* appointments mix */
 const stCol={Completed:'#0FB5A4',Confirmed:'#7C5CFA',Pending:'#F5A524',Cancelled:'#B4B1CC','No-show':'#F0508C'};
 const stItems=['Completed','Confirmed','Pending','Cancelled','No-show'].map(n=>({n,v:stc(n),color:stCol[n]})).filter(x=>x.v);
 const wd=[0,0,0,0,0,0,0],heat={};let hMax=0;
 ap.filter(a=>!inactive(a)).forEach(a=>{const d=(new Date(a.date+'T12:00').getDay()+6)%7,h=+a.time.slice(0,2);wd[d]++;heat[d+'_'+h]=(heat[d+'_'+h]||0)+1;hMax=Math.max(hMax,heat[d+'_'+h])});
 const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],hrs=[...Array(12)].map((_,i)=>9+i);
 const bestD=wd.indexOf(Math.max(...wd)),bestH=(()=>{let k=null,m=0;Object.entries(heat).forEach(([a,v])=>{if(v>m){m=v;k=a}});return k})();
 /* staff */
 const stf_=S.staff.map(s=>{const it=cur.flatMap(i=>i.items.filter(x=>x.type==='svc'&&x.staffId==s.id)),r=sum(it,x=>x.price*x.qty),n=sum(it,x=>x.qty),c=r*(s.commission||0)/100,au=ap.filter(a=>a.staffId==s.id&&a.status==='Completed').length;return{n:s.name,v:r,fv:money(r),sub:`${n} services · ${money(c)} commission (${s.commission||0}%)`,s}}).sort((a,b)=>b.v-a.v).map((x,i)=>({...x,color:PAL[i%PAL.length]}));
 /* customers */
 const first={};all.forEach(i=>{if(i.custId&&(!first[i.custId]||i.date<first[i.custId]))first[i.custId]=i.date});
 const nr=b.map(x=>{const seen=new Set(),nw=new Set();cur.filter(i=>i.custId&&within(i.date,x.f,x.t)).forEach(i=>{seen.add(i.custId);if(within(first[i.custId],x.f,x.t))nw.add(i.custId)});return[nw.size,seen.size-nw.size]});
 const spend={};cur.forEach(i=>{if(i.custId)spend[i.custId]=(spend[i.custId]||0)+i.total});
 const topC=Object.entries(spend).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const tiers=S.loyalty.tiers.map((t,i)=>({n:t.name,v:S.customers.filter(c=>tierOf(c).name===t.name).length,color:['#8E8EA9','#F5A524','#7C5CFA'][i]||PAL[i]})).filter(x=>x.v);
 /* six-month financials */
 const mths=[...Array(6)].map((_,i)=>{const d=new Date(+T.slice(0,4),+T.slice(5,7)-1-(5-i),1),m=iso(d).slice(0,7);return{l:d.toLocaleDateString('en-US',{month:'short'}),full:d.toLocaleDateString('en-US',{month:'long',year:'numeric'}),r:revIn(m+'-01',m+'-31'),e:expIn(m+'-01',m+'-31')}});
 const growth=pRev?Math.round((rev-pRev)/pRev*100):null;
 const unit=g==='d'?'day':g==='w'?'week':'month',avgU=b.length?rev/b.length:0;
 const bestB=revS.indexOf(Math.max(...revS));
 /* ---- layout ---- */
 const dl_=(c,p,l='vs prev. period')=>delta(c,p,l);
 const preset=[['7','7 days'],['30','30 days'],['90','90 days'],['365','12 months']];
 const isP=n=>from===addDays(T,-(+n-1))&&to===T;
 return `<div class="an-bar"><div class="seg" role="group" aria-label="Period">${preset.map(p=>`<button type="button" class="${isP(p[0])?'on':''}" data-a="repRange" data-n="${p[0]}">${p[1]}</button>`).join('')}</div>
  <label>From <input type="date" value="${from}" max="${to}" data-ch="repFrom" aria-label="From date"></label><label>To <input type="date" value="${to}" min="${from}" max="${T}" data-ch="repTo" aria-label="To date"></label><span class="per">${days} days · compared with ${fdate(pf).slice(0,-6)} – ${fdate(pt).slice(0,-6)}</span></div>
 <div class="ankp">
  ${akpi('violet','trend','Revenue',money(rev),dl_(rev,pRev),spark(revS))}
  ${akpi('green','wallet','Net profit',money(rev-exp),dl_(rev-exp,pRev-pExp)+`<span>· ${rev?Math.round((rev-exp)/rev*100):0}% margin</span>`,spark(vals((a,z)=>revIn(a,z)-expIn(a,z))))}
  ${akpi('rose','cal','Appointments',booked,dl_(booked,pBooked),spark(vals(apIn)))}
  ${akpi('sky','card','Avg. ticket',money(ticket),dl_(ticket,pTicket)+`<span>· ${cur.length} invoices</span>`)}
  ${akpi('teal','check','Completion rate',rate(ap)+'%',dl_(rate(ap),rate(pap))+'',`<div class="meter" style="position:absolute;left:20px;right:20px;bottom:12px;margin:0"><i style="width:${rate(ap)}%"></i></div>`)}
  ${akpi('coral','alert','No-show rate',nsRate(ap)+'%',`<span>${nos} no-show${nos===1?'':'s'} · ${canc} cancelled</span>`)}
  ${akpi('amber','users','New customers',newC,dl_(newC,pNewC))}
  ${akpi('violet','wallet','Expenses',money(exp),dl_(exp,pExp))}
 </div>
 <div class="angrid an21"><div class="card"><h3>${ic('trend')}Revenue trend<span class="sub">per ${unit}</span></h3>
  <div class="insight c-violet" style="margin-bottom:12px"><span class="kic">${ic('activity')}</span><div>${growth===null?'Not enough earlier data to compare.':`Revenue is <b>${growth>=0?'up':'down'} ${Math.abs(growth)}%</b> on the previous ${days} days.`} Averaging <b>${money(avgU)}</b> per ${unit}${revS.length?`, with the best ${unit} being <b>${esc(b[bestB].full)}</b> at <b>${money(revS[bestB])}</b>`:''}.</div></div>
  ${legend([{name:'This period',color:PAL[0]},{name:'Previous period',color:'#B4B1CC'}])}
  ${areaChart(b.map(x=>x.l),[{name:'Previous period',color:'#B4B1CC',v:prevS,dash:1,f:money},{name:'This period',color:PAL[0],v:revS,f:money}],{full:b.map(x=>x.full),label:'Revenue trend'})}</div>

 <div class="angrid an21"><div class="card"><h3>${ic('chart')}Revenue, expenses & profit<span class="sub">last 6 months</span></h3>${legend([{name:'Revenue',color:PAL[0]},{name:'Expenses',color:PAL[3]},{name:'Profit',color:PAL[2]}])}

   ${barChart(b.map(x=>x.l),[{name:'New',color:PAL[2],v:nr.map(x=>x[0]),f:v=>String(v)},{name:'Returning',color:PAL[0],v:nr.map(x=>x[1]),f:v=>String(v)}],{int:1,axis:v=>String(Math.round(v)),full:b.map(x=>x.full),label:'New versus returning customers'})}</div>
  <div class="card"><h3>${ic('heart')}Loyalty tiers</h3>${donut2(tiers,v=>String(v),String(S.customers.length),'customers')}</div>
  <div class="card"><h3>${ic('trend')}Top customers<span class="sub">by spend</span></h3>${topC.map((c,i)=>`<div class="toprow"><span class="rk">${i+1}</span><div class="bt"><b>${esc(cname(c[0]))}</b><small>${tierOf(cust(c[0])).name} · ${cur.filter(x=>x.custId==c[0]).length} visits</small></div><b>${money(c[1])}</b></div>`).join('')||empty('No customer sales in this period')}</div></div>
 <div class="angrid an12"><div class="card"><h3>${ic('box')}Top retail products</h3>${hbars(topProd.map((x,i)=>({...x,color:PAL[(i+3)%PAL.length]})))}</div>
  <div class="card"><h3>${ic('alert')}Stock health</h3>${(()=>{const low=lowStock(),ok=S.products.length-low.length;return donut2([{n:'Healthy',v:ok,color:PAL[2]},{n:'Low stock',v:low.length,color:PAL[1]}].filter(x=>x.v),v=>String(v),String(S.products.length),'products')+(low.length?`<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">${low.map(p=>`<span class="pill p-red">${esc(p.name)} · ${p.stock} left</span>`).join('')}</div>`:'')})()}</div></div>`}
const _repTables=P.reports;
P.reports=()=>{const u=S.ui,an=u.repView!=='tables',btn=`<div class="seg" role="group" aria-label="Report view"><button type="button" class="${an?'on':''}" data-a="repView" data-v="analytics">${ic('chart')} Analytics</button><button type="button" class="${an?'':'on'}" data-a="repView" data-v="tables">${ic('receipt')} Detailed tables</button></div>${an?`<button class="btn ghost" data-a="anCsv">${ic('down')}Export CSV</button>`:''}`;
 if(an)return head('Reports & analytics','Visual insights across revenue, appointments, staff and customers',btn)+analytics();
 const old=_repTables().replace(/^<div class="page-head">[\s\S]*?<div class="spacer"><\/div>[\s\S]*?<\/button><\/div>/,'');
 return head('Reports & analytics','Detailed, exportable tables',btn+`<button class="btn ghost" data-a="csv">${ic('down')}Export CSV</button>`)+old};
A.repView=d=>{S.ui.repView=d.v;render()};
A.anCsv=()=>{const u=S.ui,{b}=anBuckets(u.repFrom,u.repTo),all=live(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[['Period','Revenue','Expenses','Profit','Invoices','Appointments']].concat(b.map(x=>{const inv=all.filter(i=>within(i.date,x.f,x.t)),r=sum(inv,sales),e=sum(S.expenses.filter(z=>within(z.date,x.f,x.t)),z=>z.amt);return[x.full,r.toFixed(2),e.toFixed(2),(r-e).toFixed(2),inv.length,S.appts.filter(a=>within(a.date,x.f,x.t)&&!inactive(a)).length]}));
 dl('analytics-'+u.repFrom+'_to_'+u.repTo+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');toast('CSV downloaded')};

/* ----- colourful avatars ----- */
const AVC=[['#EEEAFF','#5A3CE0'],['#FFE7F0','#C2306C'],['#D9F5F1','#0B7E73'],['#FFF0D2','#955700']];
function colorAvatars(root){(root||document).querySelectorAll('.av:not(.rose)').forEach(a=>{if(a.dataset.c)return;const t=a.textContent.trim();let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;const c=AVC[h%AVC.length];a.dataset.c=1;a.style.background=c[0];a.style.color=c[1]})}

/* ---------- boot ---------- */
(function(){const p=location.hash.replace('#/','');if(NAV.some(n=>n[0]===p&&p!=='app'))S.ui.page=p;runRecurring();renderShell();
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
