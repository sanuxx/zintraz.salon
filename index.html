<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zintraz — Salon Management</title>
<meta name="theme-color" content="#F5F4FC"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%237C5CFA%27/%3E%3Cpath d=%27M20 22h24L20 42h24%27 stroke=%27%23ffffff%27 stroke-width=%275%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Zintraz design system — neutral SaaS + subtle luxury ===== */
:root{
 /* palette */
 --bg:#F7F7F8;--bg2:#F1F1F3;--surface:#fff;--text:#24242B;--muted:#777782;--line:#E9E8EB;
 --accent:#C58F98;--accent-bg:#F5E9EC;--accent-text:#8F5A64;--sage:#A9B7A3;--sage-bg:#EDF1EB;
 --ok:#6D9C83;--ok-bg:#E8F1EC;--ok-text:#3E6E55;--warn:#D6A45D;--warn-bg:#FBF1E1;--warn-text:#8A6224;--bad:#CF7777;--bad-bg:#F9E8E8;--bad-text:#A04B4B;
 /* semantic aliases used by existing markup */
 --card:var(--surface);--head:#FAFAFB;--inp:#fff;--secondary:#DEDDE3;--primary:#24242B;--primary-d:#101014;--on-primary:#fff;--tint:var(--accent-bg);--gold:var(--accent);
 /* shape, depth, type */
 --r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(24,24,32,.04);--shadow-md:0 4px 16px rgba(24,24,32,.07);--shadow-lg:0 18px 50px rgba(24,24,32,.16);
 --focus:0 0 0 3px rgba(197,143,152,.28);--side:#fff;--topbg:rgba(247,247,248,.82);--hov:#FAFAFB;
 --f1:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--f2:'Inter',system-ui,-apple-system,sans-serif;
 --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme=dark]{
 --bg:#141417;--bg2:#1B1B20;--surface:#1D1D22;--text:#ECECF0;--muted:#9A9AA6;--line:#2C2C33;
 --accent:#D6A0A9;--accent-bg:rgba(214,160,169,.13);--accent-text:#E2B3BB;--sage:#A9B7A3;--sage-bg:rgba(169,183,163,.12);
 --ok:#7FB095;--ok-bg:rgba(109,156,131,.16);--ok-text:#9BCBB1;--warn:#DDB170;--warn-bg:rgba(214,164,93,.14);--warn-text:#E6C186;--bad:#D98A8A;--bad-bg:rgba(207,119,119,.15);--bad-text:#E7A3A3;
 --card:var(--surface);--head:#222228;--inp:#17171B;--secondary:#34343C;--primary:#ECECF0;--primary-d:#fff;--on-primary:#17171B;
 --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 22px 60px rgba(0,0,0,.55);--side:#18181C;--topbg:rgba(20,20,23,.82);--hov:#222228;
 --focus:0 0 0 3px rgba(214,160,169,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f1);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font-family:var(--f2)}
select option{color:#24242B;background:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .28s var(--ease)}
.shell.collapsed{grid-template-columns:76px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;min-height:68px}
.brand .bt{min-width:0;line-height:1.2}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:36px;height:36px;border-radius:10px;background:var(--text);display:grid;place-items:center;color:var(--bg);flex:none;overflow:hidden}
[data-theme=dark] .logo{background:var(--accent);color:#1B1B20}
.logo img{width:100%;height:100%;object-fit:cover}
.navwrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px}
.navpill{display:flex;flex-direction:column;gap:1px}
.ngl{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--muted);font:600 10.5px/1 var(--f2);letter-spacing:.09em;text-transform:uppercase;padding:16px 10px 7px;cursor:pointer;white-space:nowrap}
.ngl svg{width:13px;height:13px;transition:transform .2s var(--ease)}
.ngl.shut svg{transform:rotate(-90deg)}
.ngi{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s var(--ease)}
.ngi.shut{grid-template-rows:0fr}
.ngi>div{overflow:hidden;display:flex;flex-direction:column;gap:1px}
.navpill a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font:500 13.5px/1.2 var(--f2);white-space:nowrap;transition:background .15s,color .15s}
.navpill a:hover{background:var(--bg2);color:var(--text)}
.navpill a.on{background:var(--bg2);color:var(--text);font-weight:600}
.navpill a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.navpill a.on svg{color:var(--accent-text)}
.navpill a .cnt{margin-left:auto;font-size:10.5px;font-weight:600;background:var(--accent-bg);color:var(--accent-text);padding:2px 7px;border-radius:10px}
.sidefoot{border-top:1px solid var(--line);padding:12px}
.side-me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:background .15s;background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit}
.side-me:hover{background:var(--bg2)}
.side-me .bt{min-width:0;line-height:1.25}
.side-me b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-me small{color:var(--muted);font-size:11.5px}
.collapse-btn{position:absolute;top:22px;right:-1px;display:none}
.shell.collapsed .brand .bt,.shell.collapsed .navpill a span,.shell.collapsed .navpill a .cnt,.shell.collapsed .ngl,.shell.collapsed .side-me .bt,.shell.collapsed .side-me>svg{display:none}
.shell.collapsed .ngi.shut{grid-template-rows:1fr}
.shell.collapsed .navpill a,.shell.collapsed .side-me,.shell.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
.shell.collapsed .navpill a.on::before{left:-12px}
.shell.collapsed .nsep{display:block;height:1px;background:var(--line);margin:10px 8px}
.nsep{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 32px;position:sticky;top:0;z-index:30;background:var(--topbg);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font:500 12.5px var(--f2);white-space:nowrap;min-width:0}
.crumbs b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:12px;height:12px;opacity:.6}
.gs{position:relative;flex:1;max-width:380px;margin-left:12px}
.gs input{padding-left:38px;padding-right:44px;height:38px;border-radius:10px;background:var(--surface)}
.gs>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;pointer-events:none}
.gs kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 11px var(--f2);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg)}
.tright{display:flex;align-items:center;gap:8px;margin-left:auto}
.pw{position:relative}
.menu-btn{display:none}
.pop,.drop{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;animation:pop .14s var(--ease);transform-origin:top right}
.gs .drop{left:0;right:auto;min-width:340px;max-height:380px;overflow:auto;transform-origin:top left}
.drop.right,.pop.wide{width:360px}
.pop .mi,.drop .it{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:8px;border:0;background:none;color:var(--text);font:500 13px var(--f2);cursor:pointer;text-align:left;text-decoration:none}
.pop .mi svg{color:var(--muted);width:16px;height:16px}
.pop .mi:hover,.drop .it:hover{background:var(--bg2)}
.pop .mi.danger{color:var(--bad-text)}.pop .mi.danger svg{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.pop .ph{padding:10px 11px 8px;line-height:1.3}.pop .ph b{display:block;font-size:13px}.pop .ph small{color:var(--muted)}
.pop .ph2{display:flex;justify-content:space-between;align-items:center;padding:8px 11px 6px;font-weight:600;font-size:13px}
.pop .ph2 button{background:none;border:0;color:var(--accent-text);font:600 12px var(--f2);cursor:pointer}
.pop select{height:34px;padding:4px 10px;font-size:12.5px}
.drop .it small,.pop .it small{color:var(--muted);display:block;font-weight:400}
.drop .lbl{font:600 10.5px var(--f2);color:var(--muted);text-transform:uppercase;letter-spacing:.09em;padding:8px 11px 3px}
.nitem{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.35}
.nitem:hover{background:var(--bg2)}
.nitem small{display:block;color:var(--muted);font-size:12px}
.nitem .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.nitem.read .dot{background:transparent;border:1.5px solid var(--line)}
.nitem.read{opacity:.7}
.spacer{flex:1}
.icon-btn{background:none;border:0;color:var(--text);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--bg2)}
.tright>.icon-btn,.tright .pw>.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px}
.tright>.icon-btn:hover,.tright .pw>.icon-btn:hover{background:var(--bg2)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font:600 10px var(--f2);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.av{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:600 12px var(--f2);flex:none;color:var(--text)}
.av.rose{background:var(--accent-bg);color:var(--accent-text)}
.av.lg{width:60px;height:60px;font-size:20px}
.content{padding:28px 32px 80px;width:100%;max-width:1360px;margin:0 auto}
.fx{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{transform:translateY(-4px) scale(.98);opacity:0}}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.page-head .btn+.btn{margin-left:0}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line);transition:box-shadow .2s var(--ease),border-color .2s,transform .2s var(--ease)}
.card.hov:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:#DDDBE0}
[data-theme=dark] .card.hov:hover{border-color:#3A3A43}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
.card h3 svg{color:var(--muted);width:16px;height:16px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
.card h3 .r{margin-left:auto;font-weight:500}
.card.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 1fr}
.stat{display:flex;gap:14px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--text);flex:none}
.stat .ic.gold{background:var(--accent-bg);color:var(--accent-text)}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.btn{background:var(--primary);color:var(--on-primary);border:1px solid transparent;height:38px;padding:0 16px;border-radius:10px;cursor:pointer;font:600 13px var(--f2);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,box-shadow .15s,transform .15s,opacity .15s;white-space:nowrap;box-shadow:0 1px 2px rgba(24,24,32,.18)}
.btn:hover{background:var(--primary-d);box-shadow:0 4px 12px rgba(24,24,32,.18)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);border-color:var(--secondary);color:var(--text);box-shadow:var(--shadow)}
.btn.ghost:hover{background:var(--bg2);box-shadow:var(--shadow)}
.btn.accent{background:var(--accent);color:#fff}.btn.accent:hover{background:#B87F89}
.btn.gold{background:var(--text);color:var(--bg)}
.btn.sm{height:30px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.danger{background:var(--surface);border-color:rgba(207,119,119,.45);color:var(--bad-text);box-shadow:none}
.btn.danger:hover{background:var(--bad-bg)}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.loading{position:relative;color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid var(--on-primary);border-right-color:transparent;animation:spin .6s linear infinite}
.btn.ghost.loading::after{border-color:var(--text);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input,.tools select{width:auto;min-width:160px}
input,select,textarea{width:100%;font-size:13.5px;color:var(--text);background:var(--inp);border:1px solid var(--secondary);border-radius:10px;padding:0 13px;height:40px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{height:auto;padding:10px 13px;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:#CFCDD6}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--focus)}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{color-scheme:dark}
input::placeholder,textarea::placeholder{color:#A3A3AD}
input[type=checkbox],input[type=radio]{width:16px;height:16px;padding:0;accent-color:#24242B;flex:none}
[data-theme=dark] input[type=checkbox]{accent-color:#D6A0A9}
input[type=file]{height:auto;padding:8px}
.fld{display:block;margin-bottom:14px;position:relative}
.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px}
.fld.bad input,.fld.bad select,.fld.bad textarea,input.bad,select.bad,textarea.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(207,119,119,.15)}
.ferr{display:block;color:var(--bad-text);font-size:12px;margin-top:5px;animation:fade .2s}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
table{width:100%;border-collapse:collapse;background:transparent}
th{background:var(--head);text-align:left;font:600 12px var(--f2);color:var(--muted);padding:11px 18px;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
th.sortable{cursor:pointer;transition:color .15s}
th.sortable:hover{color:var(--text)}
th .sa{display:inline-block;width:10px;margin-left:5px;opacity:.35;font-size:9px}
th.asc .sa,th.desc .sa{opacity:1;color:var(--accent-text)}
td{padding:13px 18px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--hov)}
.tw{overflow-x:auto}
.r{text-align:right}
.tbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbar .gs2{position:relative;max-width:300px;flex:1}
.tbar input{height:34px;padding-left:34px;font-size:13px}
.tbar .gs2 svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.tpager{display:flex;align-items:center;gap:6px;padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.tpager .spacer{flex:1}
.tpager button{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 12.5px var(--f2);cursor:pointer;padding:0 8px}
.tpager button:hover:not([disabled]){background:var(--bg2)}
.tpager button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tpager button[disabled]{opacity:.4;cursor:default}
.acts{display:flex;gap:2px;justify-content:flex-end}
.acts .icon-btn{width:30px;height:30px;border-radius:8px;color:var(--muted)}
.acts .icon-btn:hover{color:var(--text)}
.acts .icon-btn svg{width:16px;height:16px}
.kmenu{position:fixed;z-index:120;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;animation:pop .13s var(--ease)}
.kmenu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;font:500 13px var(--f2);color:var(--text);cursor:pointer;text-align:left}
.kmenu .mi:hover{background:var(--bg2)}.kmenu .mi svg{width:15px;height:15px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;font:600 11.5px var(--f2);white-space:nowrap}
.pill.dot::before,.st-Pending::before,.st-Confirmed::before,.st-Completed::before,.st-Cancelled::before,.st-No-show::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.st-Pending,.p-warn{background:var(--warn-bg);color:var(--warn-text)}
.st-Confirmed,.p-info{background:var(--accent-bg);color:var(--accent-text)}
.st-Completed,.p-ok{background:var(--ok-bg);color:var(--ok-text)}
.st-Cancelled,.p-bad{background:var(--bg2);color:var(--muted)}
.st-No-show,.p-red{background:var(--bad-bg);color:var(--bad-text)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tabs{display:inline-flex;gap:2px;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:20px;max-width:100%;overflow-x:auto}
.tabs button{background:none;border:0;padding:0 16px;height:32px;cursor:pointer;color:var(--muted);font:500 13px var(--f2);white-space:nowrap;border-radius:8px;transition:.15s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(24,24,32,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--secondary);background:var(--surface);border-radius:20px;padding:5px 14px;font:500 12.5px var(--f2);cursor:pointer;color:var(--text);transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.seg{display:inline-flex;background:var(--bg2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;font:500 12.5px var(--f2);color:var(--muted);cursor:pointer;transition:.15s}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(24,24,32,.1)}
.seg button:hover:not(.on){color:var(--text)}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.bars .b i{display:block;width:100%;max-width:40px;background:var(--bg2);border-radius:8px 8px 3px 3px;min-height:4px;transition:background .15s}
.bars .b:hover i,.bars .b.today i{background:var(--accent)}
.hb{margin-bottom:14px}
.hb div:first-child{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.hb .tr{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s var(--ease)}
.alert{background:var(--warn-bg);border:1px solid rgba(214,164,93,.35);color:var(--warn-text);border-radius:12px;padding:11px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;font-size:13px}
.alert.lime{background:var(--accent-bg);border-color:rgba(197,143,152,.35);color:var(--accent-text)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.svc{transition:transform .2s var(--ease),box-shadow .2s}
.svc:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.svc h4{font-size:15px;margin:6px 0 4px}
.svc .price{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.svc .price s{font-size:13px;color:var(--muted);font-weight:400;margin-right:6px}
.tag{font:600 10.5px var(--f2);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
.offer{background:var(--accent-bg);color:var(--accent-text);font:600 11px var(--f2);padding:2px 9px;border-radius:12px;float:right}
.person{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.tot{display:flex;justify-content:space-between;padding:5px 0}
.tot.big{font-size:18px;font-weight:700;border-top:1px dashed var(--secondary);margin-top:8px;padding-top:12px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty-s{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty-s .eic{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
.pane{display:none}.pane.on{display:block}
.scrim{display:none}

/* ---------- dashboard ---------- */
.welcome{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.welcome h1{font-size:26px;font-weight:700;letter-spacing:-.025em}
.welcome p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:620px}
.welcome .qa{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi .kh{display:flex;align-items:center;gap:8px;color:var(--muted);font:500 12.5px var(--f2)}
.kpi .kh svg{width:15px;height:15px}
.kpi .kv{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-top:6px}
.kpi .kf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px;min-height:20px}
.dl{display:inline-flex;align-items:center;gap:3px;font:600 11.5px var(--f2);padding:1px 7px;border-radius:12px}
.dl.up{background:var(--ok-bg);color:var(--ok-text)}.dl.dn{background:var(--bad-bg);color:var(--bad-text)}.dl.eq{background:var(--bg2);color:var(--muted)}
.kpi .spark{position:absolute;right:14px;bottom:14px;width:92px;height:34px;opacity:.9}
.kpi .meter{height:5px;background:var(--bg2);border-radius:5px;margin-top:8px;overflow:hidden}.kpi .meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .6s var(--ease)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font:500 11px var(--f2);fill:var(--muted)}
.chart .area{fill:url(#ag);}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2;opacity:0;transition:opacity .12s}
.chart .gd{stroke:var(--secondary);stroke-dasharray:3 3;opacity:0}
.chart .hv:hover .pt,.chart .hv:hover .gd{opacity:1}
.chart .hv rect{fill:transparent}
.ctip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font:500 12px/1.4 var(--f2);padding:7px 11px;border-radius:9px;box-shadow:var(--shadow-md);opacity:0;transform:translate(-50%,-110%);transition:opacity .12s;white-space:nowrap;z-index:5}
.ctip b{display:block;font-weight:700;font-size:13px}
.chead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.chead .big{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.donutw{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:600}
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.tli:first-child{border-top:0;padding-top:0}
.tli:hover .tt{color:var(--accent-text)}
.tli .tm{width:74px;white-space:nowrap;flex:none;font:600 12.5px var(--f2);color:var(--text);padding-top:1px}
.tli .tm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tli .tb{flex:1;min-width:0;border-left:2px solid var(--line);padding-left:12px}
.tli .tt{font-weight:600;font-size:13.5px;transition:color .15s}
.tli .ts{color:var(--muted);font-size:12.5px}
.tli.s-Pending .tb{border-color:var(--warn)}.tli.s-Confirmed .tb{border-color:var(--accent)}.tli.s-Completed .tb{border-color:var(--ok)}.tli.s-Cancelled .tb,.tli.s-No-show .tb{border-color:var(--secondary)}
.tli.now .tm{color:var(--accent-text)}
.staffrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.staffrow:first-of-type{border-top:0;padding-top:0}
.staffrow .bt{flex:1;min-width:0;line-height:1.3}.staffrow b{font-weight:600;font-size:13px}.staffrow small{display:block;color:var(--muted);font-size:12px}
.sdot{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f2);color:var(--muted)}
.sdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sdot.ok{color:var(--ok-text)}.sdot.ok::before{background:var(--ok)}
.sdot.busy{color:var(--accent-text)}.sdot.busy::before{background:var(--accent)}
.sdot.warn{color:var(--warn-text)}.sdot.warn::before{background:var(--warn)}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.fi:first-child{border-top:0;padding-top:0}
.fi .fic{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;color:var(--muted);flex:none}
.fi .fic svg{width:15px;height:15px}
.fi small{display:block;color:var(--muted);font-size:12px}
.txrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.txrow:first-child{border-top:0;padding-top:0}
.txrow:hover b.n{color:var(--accent-text)}
.txrow .bt{flex:1;min-width:0;line-height:1.3}.txrow b.n{font-weight:600;font-size:13px;transition:color .15s}.txrow small{display:block;color:var(--muted);font-size:12px}
.txrow .amt{font-weight:700;font-size:13.5px;text-align:right}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;width:86px;height:86px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-size:22px;font-weight:700}
.big{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.03em}

/* ---------- skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--line) 37%,var(--bg2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-h{height:30px;width:260px;margin-bottom:12px}.sk-p{height:14px;width:380px;max-width:100%;margin-bottom:26px}
.sk-c{height:112px;border-radius:14px}.sk-b{height:300px;border-radius:14px}

/* ---------- calendar ---------- */
.calbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.calbar .ttl{font:700 15px var(--f1);letter-spacing:-.01em;min-width:150px}
.calbar .nv{display:inline-flex;gap:4px}
.calbar select{width:auto;min-width:140px;height:34px;font-size:13px}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tg-scroll{overflow:auto;max-height:calc(100vh - 250px);min-height:420px}
.tg-in{display:grid;min-width:max-content}
.tg-h{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;font:600 12px var(--f2);color:var(--muted);min-width:130px}
.tg-h b{display:block;font:700 18px var(--f1);color:var(--text);letter-spacing:-.02em}
.tg-h.today b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);font-size:15px;margin:1px auto 0}
.tg-h small{display:block;font-weight:500;font-size:11.5px}
.tg-corner{position:sticky;left:0;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-gut{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);width:58px}
.tg-gut span{position:absolute;right:8px;transform:translateY(-50%);font:500 11px var(--f2);color:var(--muted)}
.tg-col{position:relative;border-right:1px solid var(--line);cursor:cell;min-width:130px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.tg-col:last-child{border-right:0}
.tg-col.off{background-color:var(--head);cursor:not-allowed}
.tg-col.today{background-color:rgba(197,143,152,.045)}
.tg-col.over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:var(--accent-bg)}
.tev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;border:1px solid transparent;border-left-width:3px;transition:box-shadow .15s,transform .15s;z-index:2}
.tev:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);z-index:3}
.tev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev span{display:block;color:inherit;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev[draggable=true]{cursor:grab}
.tev.s-Pending,.mev.s-Pending{background:var(--warn-bg);border-color:rgba(214,164,93,.3);border-left-color:var(--warn);color:var(--warn-text)}
.tev.s-Confirmed,.mev.s-Confirmed{background:var(--accent-bg);border-color:rgba(197,143,152,.3);border-left-color:var(--accent);color:var(--accent-text)}
.tev.s-Completed,.mev.s-Completed{background:var(--ok-bg);border-color:rgba(109,156,131,.3);border-left-color:var(--ok);color:var(--ok-text)}
.tev.s-Cancelled,.mev.s-Cancelled{background:var(--bg2);border-left-color:var(--secondary);color:var(--muted);text-decoration:line-through}
.tev.s-No-show,.mev.s-No-show{background:var(--bad-bg);border-left-color:var(--bad);color:var(--bad-text)}
.nowl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:4;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.mgrid .dh{padding:10px;text-align:center;font:600 11.5px var(--f2);color:var(--muted);border-bottom:1px solid var(--line);background:var(--head);text-transform:uppercase;letter-spacing:.06em}
.mcell{min-height:112px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;min-width:0}
.mcell:nth-child(7n+14){border-right:0}
.mcell:hover{background:var(--hov)}
.mcell.out{background:var(--head)}.mcell.out .dn{color:#B3B3BC}
.mcell .dn{font:600 12.5px var(--f2);display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;margin-bottom:4px}
.mcell.today .dn{background:var(--text);color:var(--bg)}
.mev{display:block;font-size:11.5px;padding:2px 7px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid;font-weight:500}
.mmore{font-size:11.5px;color:var(--muted);font-weight:600;padding-left:4px}
.det .row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.det .row:first-child{border-top:0}.det .row span{color:var(--muted)}.det .row b{font-weight:600;text-align:right}

/* ---------- drawers, dialogs, toasts ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,24,32,.38);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:16px;animation:fadeo .18s}
@keyframes fadeo{from{opacity:0}}
.overlay.drawer{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:16px;width:min(500px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:zoom .2s var(--ease);border:1px solid var(--line)}
.modal.wide{width:min(760px,100%)}
@keyframes zoom{from{transform:translateY(10px) scale(.98);opacity:0}}
.drawer .modal{width:min(500px,100%);max-height:100vh;height:100vh;border-radius:18px 0 0 18px;border-width:0 0 0 1px;animation:slidein .28s var(--ease)}
.drawer .modal.wide{width:min(760px,100%)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:16px;font-weight:700}
.mbody{padding:22px 24px;overflow:auto;flex:1}
.mfoot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--head)}
.drawer .mfoot{border-radius:0 0 0 18px}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--surface);color:var(--text);padding:12px 14px 12px 16px;border-radius:12px;font:500 13px/1.4 var(--f2);box-shadow:var(--shadow-lg);border:1px solid var(--line);border-left:3px solid var(--ok);animation:toastin .28s var(--ease);display:flex;gap:10px;align-items:center;min-width:240px}
@keyframes toastin{from{transform:translateX(24px);opacity:0}}
.toast svg{color:var(--ok);width:17px;height:17px}
.toast.err{border-left-color:var(--bad)}.toast.err svg{color:var(--bad)}
.toast .tx{flex:1}.toast .tc{background:none;border:0;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;padding:0}
.toast .tc:hover{background:var(--bg2)}
.toast.out{opacity:0;transform:translateX(24px);transition:.2s}

/* ---------- login & public pages ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .art .logo{background:var(--accent);color:#fff}
.login .art{background:#24242B;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;bottom:-140px;background:radial-gradient(circle,rgba(197,143,152,.35),transparent 70%)}
.login .art .wm{font:700 18px var(--f1);letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.login .art h2{font:600 34px/1.2 var(--f1);letter-spacing:-.03em;max-width:420px;position:relative;z-index:1}
.login .art p{color:#B9B9C2;max-width:380px;margin:14px 0 0;position:relative;z-index:1}
.login .art small{color:#8C8C98}
.login .pane2{display:grid;place-items:center;padding:24px}
.login .box{width:min(380px,100%);text-align:left}
.login .box h1{font-size:24px;font-weight:700;letter-spacing:-.025em}
.login .box>p{color:var(--muted);margin:6px 0 26px;font-size:13.5px}
.login .box .logo{display:none}
.login .btn{width:100%;height:42px}
.quick{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap;align-items:center}
.quick:before{content:"Continue as";font-size:12px;color:var(--muted);margin-right:4px}
.invoice{font-size:13px}
.invoice .ih{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;align-items:flex-start}
.invoice hr{border:0;border-top:1px dashed var(--secondary);margin:14px 0}
.hours{display:grid;grid-template-columns:90px 60px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.pub{max-width:980px;margin:0 auto;padding:28px 20px 80px}
.pub .phead{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.pub .phead b{font-size:18px;font-weight:700}
.steps{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:30px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12.5px var(--f2)}
.steps span i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:11px;font-weight:600}
.steps span.on{border-color:var(--text);color:var(--text)}
.steps span.on i{background:var(--text);color:var(--bg)}.steps span.done i{background:var(--ok);color:#fff}
.opt{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;border:1px solid var(--line)}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.opt.sel{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:12px}
.day{min-width:62px;text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--surface);flex:none;transition:.15s}
.day:hover{border-color:var(--text)}
.day small{display:block;color:var(--muted);font-size:11px}
.day b{font-size:17px;font-weight:700}
.day.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.day.sel small{color:var(--bg);opacity:.75}
.day.off{opacity:.35;cursor:not-allowed}
.col.over,.tg-col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.gcard{background:linear-gradient(135deg,#2E2E36,#24242B);color:#fff;border-radius:16px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.08)}
.gcard .code{font-family:ui-monospace,Consolas,monospace;letter-spacing:.12em;font-size:17px;color:#F5E9EC}
.gcard b{font-size:28px;font-weight:700}
.prog{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;min-width:90px}

/* ---------- REPORTS ---------- */
const REPS=[['daily','Daily sales'],['monthly','Monthly sales'],['service','Service-wise sales'],['product','Product sales'],['appt','Appointments'],['customer','Customers'],['staff','Staff performance'],['comm','Staff commission'],['expense','Expenses'],['profit','Profit'],['stock','Stock']];
function report(k,a,b){const inv=live().filter(i=>inRange(i.date,a,b));const g=(arr,f)=>{const o={};arr.forEach(x=>{const key=f(x);(o[key]=o[key]||[]).push(x)});return o};
 switch(k){
 case 'daily':{const o=g(inv,i=>i.date);const r=Object.keys(o).sort().reverse().map(d=>[fdate(d),o[d].length,money(sum(o[d],i=>sum(i.items.filter(x=>x.type==='svc'),x=>x.qty*x.price))),money(sum(o[d],i=>sum(i.items.filter(x=>x.type==='prod'),x=>x.qty*x.price))),money(sum(o[d],i=>i.disc)),money(sum(o[d],i=>i.tax)),money(sum(o[d],i=>i.total))]);
  return{cols:['Date','Invoices','Services','Products','Discounts','Tax','Total'],rows:r,sum:[['Total sales',money(sum(inv,i=>i.total))],['Invoices',inv.length],['Avg / day',money(sum(inv,i=>i.total)/Math.max(1,r.length))]]}}
 case 'monthly':{const o=g(inv,i=>i.date.slice(0,7));return{cols:['Month','Invoices','Subtotal','Discounts','Tax','Total'],rows:Object.keys(o).sort().reverse().map(m=>[m,o[m].length,money(sum(o[m],i=>i.sub)),money(sum(o[m],i=>i.disc)),money(sum(o[m],i=>i.tax)),money(sum(o[m],i=>i.total))]),sum:[['Total sales',money(sum(inv,i=>i.total))]]}}
 case 'service':{const o=g(inv.flatMap(i=>i.items.filter(x=>x.type==='svc')),x=>x.name);const r=Object.entries(o).map(([n,l])=>[n,sum(l,x=>x.qty),sum(l,x=>x.qty*x.price)]).sort((x,y)=>y[2]-x[2]);return{cols:['Service','Times sold','Revenue'],rows:r.map(x=>[x[0],x[1],money(x[2])]),sum:[['Service revenue',money(sum(r,x=>x[2]))],['Services performed',sum(r,x=>x[1])]]}}

 case 'appt':{const l=S.appts.filter(x=>inRange(x.date,a,b)).sort(apSort).reverse();const c=s=>l.filter(x=>x.status===s).length;return{cols:['Date','Time','Customer','Service','Staff','Status'],rows:l.map(x=>[fdate(x.date),t12(x.time),cname(x.custId),svc(x.svcId).name,stf(x.staffId).name,x.status]),sum:[['Total',l.length],['Completed',c('Completed')],['Pending / Confirmed',c('Pending')+c('Confirmed')],['Cancelled',c('Cancelled')],['No-shows',c('No-show')]]}}
 case 'customer':{const r=S.customers.map(c=>{const iv=inv.filter(i=>i.custId==c.id);return[c.name,iv.length,sum(iv,i=>i.total),sum(iv,i=>i.total-paid(i)),iv.map(i=>i.date).sort().pop()]}).sort((x,y)=>y[2]-x[2]);return{cols:['Customer','Visits','Spent','Outstanding','Last visit'],rows:r.map(x=>[x[0],x[1],money(x[2]),money(x[3]),fdate(x[4])]),sum:[['Active customers',r.filter(x=>x[1]).length],['Total spent',money(sum(r,x=>x[2]))]]}}
 case 'staff':{const r=S.staff.map(s=>{const n=sum(inv,i=>sum(i.items.filter(x=>x.type==='svc'&&x.staffId==s.id),x=>x.qty));const ca=S.appts.filter(x=>x.staffId==s.id&&inRange(x.date,a,b)&&x.status==='Cancelled').length;return[s.name,s.role,n,commission(s.id,a,b).rev,ca,rate(s)]});return{cols:['Staff','Role','Services','Revenue','Cancellations','Rating'],rows:r.map(x=>[x[0],x[1],x[2],money(x[3]),x[4],'★ '+x[5]]),sum:[['Services performed',sum(r,x=>x[2])],['Team revenue',money(sum(r,x=>x[3]))]]}}
 case 'comm':{const r=S.staff.map(s=>{const c=commission(s.id,a,b);return[s.name,c.rev,s.commission,c.com]});return{cols:['Staff','Service revenue','Rate','Commission'],rows:r.map(x=>[x[0],money(x[1]),x[2]+'%',money(x[3])]),sum:[['Total commission',money(sum(r,x=>x[3]))]]}}
 case 'expense':{const l=S.expenses.filter(e=>inRange(e.date,a,b)).sort((x,y)=>y.date.localeCompare(x.date));return{cols:['Date','Category','Description','Amount'],rows:l.map(e=>[fdate(e.date),e.cat,e.desc,money(e.amt)]),sum:[['Total expenses',money(sum(l,e=>e.amt))]]}}
 case 'profit':{const ms=[...new Set([...inv.map(i=>i.date.slice(0,7)),...S.expenses.filter(e=>inRange(e.date,a,b)).map(e=>e.date.slice(0,7))])].sort().reverse();const r=ms.map(m=>{const rv=sum(inv.filter(i=>i.date.startsWith(m)),i=>i.total),ex=sum(S.expenses.filter(e=>e.date.startsWith(m)&&inRange(e.date,a,b)),e=>e.amt);return[m,rv,ex,rv-ex,rv?Math.round((rv-ex)/rv*100)+'%':'—']});return{cols:['Month','Revenue','Expenses','Net profit','Margin'],rows:r.map(x=>[x[0],money(x[1]),money(x[2]),money(x[3]),x[4]]),sum:[['Revenue',money(sum(r,x=>x[1]))],['Expenses',money(sum(r,x=>x[2]))],['Net profit',money(sum(r,x=>x[3]))]]}}
 case 'stock':{return{cols:['Product','Category','In stock','Min','Value at cost','Status'],rows:S.products.map(p=>[p.name,p.cat,p.stock,p.min,money(p.stock*p.cost),p.stock<=p.min?'Low stock':'OK']),sum:[['Stock value',money(sum(S.products,p=>p.stock*p.cost))],['Low-stock items',lowStock().length]]}}}}

/* conflicts */
function apptConflict(f,id){
 if(inactive(f))return'';
 const c=S.appts.find(x=>x.id!=id&&x.staffId==f.staffId&&x.date===f.date&&!inactive(x)&&overlap(f.time,f.dur,x.time,x.dur));
 if(c)return stf(f.staffId).name+' is already booked at '+t12(c.time);
 if(onLeaveOn(stf(f.staffId),f.date))return stf(f.staffId).name+' is on leave that day';
 if(f.resId&&busyRes(f.resId,f.date,f.time,f.dur,id))return S.resources.find(r=>r.id==f.resId).name+' is already in use at that time';
 return''}
/* drag & drop rescheduling */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.ev[draggable]');if(c){dragId=+c.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragId))}});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('[data-drop-date]');if(c&&dragId){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('[data-drop-date]')?.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest?.('[data-drop-date]');if(!c||!dragId)return;e.preventDefault();c.classList.remove('over');moveAppt(dragId,c.dataset.dropDate,c.dataset.dropStaff);dragId=null});
document.addEventListener('dragend',()=>{dragId=null;$$('.over').forEach(x=>x.classList.remove('over'))});
function moveAppt(id,date,staffId,time){const a=S.appts.find(x=>x.id==id);if(!a)return;
 const n={...a,date,staffId:staffId?+staffId:a.staffId,time:time||a.time};
 if(n.date===a.date&&n.staffId===a.staffId&&n.time===a.time)return;
 if(n.resId&&busyRes(n.resId,n.date,n.time,n.dur,id)){const r=freeRes(svc(n.svcId).cat,n.date,n.time,n.dur,id)[0];n.resId=r?r.id:''}
 const m=apptConflict(n,id);if(m){toast(m,'err');return}
 Object.assign(a,n);delete S.reminded[id];toast('Moved to '+fdow(date)+' '+fdate(date).slice(0,-6)+' · '+t12(a.time)+' · '+stf(a.staffId).name);render()}

/* waitlist: offer a freed slot */
function offerWaitlist(a){
 const m=S.waitlist.filter(w=>w.svcId==a.svcId&&w.date===a.date&&(!w.staffId||w.staffId==a.staffId));
 if(!m.length)return;
 openModal('Slot available — fill from waitlist',`<p style="margin-top:0">${esc(svc(a.svcId).name)} with <b>${esc(stf(a.staffId).name)}</b> on ${fdate(a.date)} at <b>${t12(a.time)}</b> just opened up. ${m.length} customer${m.length>1?'s are':' is'} waiting:</p>
 ${m.map(w=>`<div class="tot" style="align-items:center;border-bottom:1px solid var(--line);padding:8px 0"><span><b style="font-weight:500">${esc(cname(w.custId))}</b><div class="small muted">${esc(w.notes||'No preference')}</div></span><button type="button" class="btn sm" data-a="fillSlot" data-w="${w.id}" data-ap="${a.id}">Book this slot</button></div>`).join('')}`,{footer:false})}
A.fillSlot=d=>{const w=S.waitlist.find(x=>x.id==d.w),a=S.appts.find(x=>x.id==d.ap);
 S.appts.push({id:uid(),custId:w.custId,svcId:a.svcId,staffId:a.staffId,date:a.date,time:a.time,dur:a.dur,status:'Confirmed',notes:'Booked from waitlist',resId:a.resId||''});
 S.waitlist=S.waitlist.filter(x=>x.id!=w.id);closeModal();toast(cname(w.custId)+' booked into the freed slot');render()};
function waitView(){return `<div class="tools"><button class="btn" data-a="addWait">${ic('plus')}Add to waitlist</button><span class="muted small">When an appointment is cancelled, matching customers are offered the slot automatically.</span></div>

function draftCalc(){const d=S.draft,c=cust(d.custId),L=S.loyalty;
 let red=Math.min(+d.redeem||0,c?c.points||0:0);red=Math.floor(red/L.redeemPts)*L.redeemPts;
 const x=calc(d.items,d.discType,d.discVal,{voucher:d.voucher,redeem:red});
 const usedPts=Math.round(x.l/L.redeemVal*L.redeemPts),g=d.gift?gcard(d.gift):null,gift=g?Math.min(g.balance,x.total):0;
 return{...x,usedPts,gift,due:x.total-gift,g,c}}

 const earned=earnPts(cu,c.total);

 inv.items.forEach(i=>{if(i.type==='prod')prod(i.ref).stock-=i.qty;if(i.pkgUse)S.pkgs.find(p=>p.id==i.pkgUse).used++});

 if(d.voucher)S.vouchers.find(v=>v.code===d.voucher.code).uses++;

  ${(dw.moves||[]).length?`<div class="card" style="margin-bottom:18px"><h3>Today's cash movements</h3>${dw.moves.map(m=>`<div class="tot"><span>${m.type==='in'?'＋':'－'} ${esc(m.why)}</span><span>${money(m.amt)}</span></div>`).join('')}</div>`:''}`}

 <div class="card flush tw"><table><thead><tr><th>Customer</th><th>Package</th><th>Sessions</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody>${S.pkgs.slice().reverse().map(p=>{const left=p.total-p.used,st=left<=0?['Used up','p-bad']:p.expires<T?['Expired','p-red']:['Active','p-ok'];return `<tr><td>${esc(cname(p.custId))}</td><td>${esc(p.name)}</td><td><div class="prog"><i style="width:${p.used/p.total*100}%"></i></div><span class="small muted">${p.used} used · ${left} left</span></td><td>${fdate(p.expires)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td>${acts(st[0]==='Active'?`<button class="btn sm ghost" data-a="pkgUse" data-id="${p.id}">Use session</button>`:'')}</td></tr>`}).join('')||`<tr><td colspan="6">${empty('No packages sold yet')}</td></tr>`}</tbody></table></div>`}

 <div class="card"><h3>Staff ratings</h3>${S.staff.map(s=>`<div class="tot"><span>${esc(s.name)} <span class="muted small">(${S.feedback.filter(x=>x.staffId==s.id).length})</span></span><b style="font-weight:500"><span style="color:#ffc857">★</span> ${rate(s)}</b></div>`).join('')}<p class="muted small" style="margin-bottom:0">These averages feed the Staff directory, performance tab and reports.</p></div></div>`}

function renderFeedback(){const id=+location.hash.split('/')[2],a=S.appts.find(x=>x.id===id),f=S.ui.fb,s=S.settings;
 const back=S.ui.user?`<button class="btn ghost sm" data-a="goDesk" data-p="growth">← Back to admin</button>`:'';

 S.feedback=S.feedback.filter(x=>x.apptId!==a.id);S.feedback.push({id:uid(),apptId:a.id,custId:a.custId,staffId:a.staffId,svcId:a.svcId,rating:f.rating,comment:$('#fbText').value.trim(),date:T});f.done=true;renderFeedback()};

 return `<div class="grid g12"><div class="card"><h3>${ic('cal')}Public booking page</h3><p class="muted" style="margin-top:0">Customers pick a service, stylist and time slot — no login. Availability follows staff hours, leave, existing bookings, rooms and your opening hours. New requests arrive as <b>Pending</b>.</p>

const bkPool=s=>{const b=S.ui.bk;if(b.staffId!=='any')return S.staff.filter(x=>x.id==b.staffId);const m=S.staff.filter(x=>x.cat===s.cat);return m.length?m:S.staff};
function bkSlots(){const b=S.ui.bk,s=svc(b.svcId),h=S.settings.hours[fdow(b.date)];if(!s||!h||!h.open)return[];
 const out=[],now=new Date(),nm=now.getHours()*60+now.getMinutes(),needRes=S.resources.some(r=>r.cats.includes(s.cat));
 for(let m=tMin(h.from);m+s.dur<=tMin(h.to);m+=S.settings.slot){const t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  if(b.date===T&&m<nm+S.settings.online.lead*60)continue;
  if(bkPool(s).some(x=>staffFree(x,b.date,t,s.dur))&&(!needRes||freeRes(s.cat,b.date,t,s.dur).length))out.push(t)}
 return out}
function renderBooking(){const b=S.ui.bk,o=S.settings.online,st=S.settings,s=svc(b.svcId);let body='';
 const stepNames=['Service','Stylist','Date & time','Your details'];
 const back=S.ui.user?`<button class="btn ghost sm" data-a="goDesk" data-p="growth">← Admin</button>`:'';
 if(!o.on)body=`<div class="card empty">Online booking is currently unavailable. Please call ${esc(st.phone)}.</div>`;
 else if(b.done){const a=S.appts.find(x=>x.id===b.done);body=`<div class="card" style="text-align:center;padding:36px"><div class="stat" style="justify-content:center"><div class="ic gold">${ic('check')}</div></div><h2 style="font-weight:600;font-size:28px;margin:14px 0 4px">You're booked in!</h2><p class="muted">Booking ref <b>OB-${a.id}</b> · status Pending until the salon confirms</p><div style="display:inline-block;text-align:left;margin:14px 0"><div class="kv"><span>Service</span><b style="font-weight:500">${esc(svc(a.svcId).name)}</b><span>With</span><b style="font-weight:500">${esc(stf(a.staffId).name)}</b><span>When</span><b style="font-weight:500">${fdow(a.date)}, ${fdate(a.date)} · ${t12(a.time)}</b><span>Where</span><b style="font-weight:500">${esc(st.address)}</b></div></div><div><button class="btn" data-a="bkReset">Book another</button></div></div>`}
 else{
  if(b.step===1){const cats=['All',...catList()];body=`<div class="chips" style="margin-bottom:16px">${cats.map(c=>`<span class="chip ${b.cat===c?'on':''}" data-a="bkCat" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</div><div class="svc-grid">${S.services.filter(x=>b.cat==='All'||x.cat===b.cat).map(x=>`<div class="card svc opt ${b.svcId===x.id?'sel':''}" data-a="bkSvc" data-id="${x.id}">${x.disc?`<span class="offer">${x.disc}% OFF</span>`:''}<span class="tag">${esc(x.cat)}</span><h4>${esc(x.name)}</h4><p class="muted small" style="margin:0 0 10px">${esc(x.desc)}</p><div class="price">${money(x.price*(1-x.disc/100))} <span class="muted small">· ${x.dur} min</span></div></div>`).join('')}</div>`}
  if(b.step===2)body=`<div class="svc-grid"><div class="card opt person ${b.staffId==='any'?'sel':''}" data-a="bkStaff" data-id="any"><div class="av lg rose">${ic('users')}</div><h4>Any available</h4><span class="muted small">Fastest — we'll assign the best match</span></div>${S.staff.map(x=>`<div class="card opt person ${b.staffId===x.id?'sel':''}" data-a="bkStaff" data-id="${x.id}"><div class="av lg">${ini(x.name)}</div><h4>${esc(x.name)}</h4><span class="tag">${esc(x.role)}</span><span class="small"><span style="color:#ffc857">★</span> ${rate(x)}</span>${x.cat===s.cat?'<span class="pill p-info">Specialist</span>':''}</div>`).join('')}</div>`;
  if(b.step===3){if(!b.date)b.date=[...Array(o.days)].map((_,i)=>addDays(T,i)).find(d=>st.hours[fdow(d)].open)||T;const sl=bkSlots();
   body=`<div class="days">${[...Array(o.days)].map((_,i)=>{const d=addDays(T,i),off=!st.hours[fdow(d)].open;return `<div class="day ${d===b.date?'sel':''} ${off?'off':''}" ${off?'':`data-a="bkDate" data-d="${d}"`}><small>${fdow(d)}</small><b>${fday(d)}</b><small>${new Date(d+'T12:00').toLocaleDateString('en-US',{month:'short'})}</small></div>`}).join('')}</div><div class="card"><h3>${ic('clock')}Available times on ${fdate(b.date)}</h3><div class="chips">${sl.map(t=>`<span class="chip ${b.time===t?'on':''}" data-a="bkTime" data-t="${t}">${t12(t)}</span>`).join('')||'<span class="muted">No free slots this day — try another date or stylist.</span>'}</div></div>`}
  if(b.step===4){const pool=bkPool(s).filter(x=>staffFree(x,b.date,b.time,s.dur))[0];body=`<div class="grid g12"><div class="card"><h3>Your details</h3>${fi('Full name','','','text','id="bkName" placeholder="Jane Doe"')}${fi('Phone','','','tel','id="bkPhone" placeholder="+1 555 000 1234"')}${fi('Email (optional)','','','email','id="bkEmail"')}<button class="btn" data-a="bkSubmit">Confirm booking</button></div><div class="card"><h3>Summary</h3><div class="kv"><span>Service</span><b style="font-weight:500">${esc(s.name)}</b><span>Stylist</span><b style="font-weight:500">${b.staffId==='any'?(pool?esc(pool.name)+' (assigned)':'Any'):esc(stf(b.staffId).name)}</b><span>When</span><b style="font-weight:500">${fdow(b.date)}, ${fdate(b.date)} · ${t12(b.time)}</b><span>Duration</span><b style="font-weight:500">${s.dur} min</b><span>Price</span><b style="font-weight:500">${money(s.price*(1-s.disc/100))}</b></div></div></div>`}
 }
 $('#app').innerHTML=`<div class="pub"><div class="phead"><div class="logo">${st.logo?`<img src="${st.logo}">`:ic('flower')}</div><div><b>${esc(st.name)}</b><div class="muted small">${esc(st.address)}</div></div><span class="spacer"></span><button class="icon-btn" data-a="theme" title="Light / dark">${ic(S.ui.theme==='light'?'moon':'sun')}</button>${back}</div>
 ${o.on&&!b.done?`<h1 style="font-weight:600;font-size:34px;margin-bottom:16px">Book an appointment</h1><div class="steps">${stepNames.map((n,i)=>`<span class="${b.step===i+1?'on':''} ${b.step>i+1?'done':''}"><i>${b.step>i+1?'✓':i+1}</i>${n}</span>`).join('')}</div>`:''}${body}
 ${o.on&&!b.done&&b.step>1?`<div style="margin-top:18px"><button class="btn ghost" data-a="bkBack">← Back</button></div>`:''}</div>`}

A.viewPO=d=>{const p=S.pos.find(x=>x.id==d.id);
 openModal('Purchase order '+p.no,`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><b style="font-weight:500">${esc(supOf(p.supplierId)?.name||'—')}</b><span class="pill ${poCls(p.status)}">${p.status}</span><span class="spacer"></span><span class="muted small">Expected ${fdate(p.expected)}</span></div>
 <div class="tw"><table><thead><tr><th>Product</th><th class="r">Qty</th><th class="r">Cost</th><th class="r">Received</th><th class="r">Line</th></tr></thead><tbody>${p.items.map(i=>`<tr><td>${esc(prod(i.prodId)?.name||'(deleted)')}</td><td class="r">${i.qty}</td><td class="r">${money(i.cost)}</td><td class="r">${i.received}</td><td class="r">${money(i.qty*i.cost)}</td></tr>`).join('')}</tbody></table></div><div class="tot big"><span>Total</span><span>${money(poTotal(p))}</span></div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${p.status==='Draft'?`<button type="button" class="btn" data-a="poOrder" data-id="${p.id}">Mark as ordered</button><button type="button" class="btn danger" data-a="poDel" data-id="${p.id}">Delete</button>`:''}${p.status==='Ordered'||p.status==='Partial'?`<button type="button" class="btn" data-a="poReceive" data-id="${p.id}">Receive stock</button>`:''}</div>`,{footer:false})};
A.poOrder=d=>{const p=S.pos.find(x=>x.id==d.id);p.status='Ordered';p.date=T;closeModal();toast(p.no+' marked as ordered (supplier emailed — demo)');render()};

A.poReceive=d=>{const p=S.pos.find(x=>x.id==d.id);
 openModal('Receive stock — '+p.no,`<div class="tw"><table><thead><tr><th>Product</th><th class="r">Ordered</th><th class="r">Received so far</th><th>Receive now</th></tr></thead><tbody>${p.items.map((i,k)=>`<tr><td>${esc(prod(i.prodId)?.name||'')}</td><td class="r">${i.qty}</td><td class="r">${i.received}</td><td><input type="number" name="r${k}" min="0" max="${i.qty-i.received}" value="${i.qty-i.received}" style="width:90px;padding:6px 8px"></td></tr>`).join('')}</tbody></table></div><label class="chip" style="margin-top:14px"><input type="checkbox" name="exp" checked> Record as a “Product Purchases” expense</label>`,{wide:true,submit:'Receive',onSubmit:f=>{let cost=0;

function recTab(){const nxt=r=>{let m=T.slice(0,7);if(m+'-'+String(Math.min(r.day,28)).padStart(2,'0')<=T||r.posted.includes(m))m=nextMonth(m);return fdate(m+'-'+String(Math.min(r.day,28)).padStart(2,'0'))};
 return `<div class="tools"><button class="btn" data-a="editRec">${ic('plus')}New recurring expense</button><button class="btn ghost" data-a="runRec">Post due items now</button><span class="muted small">Items post themselves on their day each month.</span></div><div class="card flush tw"><table><thead><tr><th>Description</th><th>Category</th><th class="r">Amount</th><th>Day</th><th>Next posting</th><th>Status</th><th></th></tr></thead><tbody>${S.recurring.map(r=>`<tr><td>${esc(r.desc)}</td><td><span class="pill p-info">${esc(r.cat)}</span></td><td class="r">${money(r.amt)}</td><td>${r.day}</td><td>${r.active?nxt(r):'—'}</td><td><span class="pill ${r.active?'p-ok':'p-bad'}">${r.active?'Active':'Paused'}</span></td><td>${acts(ib('togRec','check',r.id,r.active?'Pause':'Resume'),ib('editRec','edit',r.id,'Edit'),ib('delRec','trash',r.id,'Delete'))}</td></tr>`).join('')||`<tr><td colspan="7">${empty('No recurring expenses')}</td></tr>`}</tbody></table></div>`}
A.runRec=()=>{const n=runRecurring();toast(n?n+' expense'+(n>1?'s':'')+' posted':'Nothing due right now');render()};
A.togRec=d=>{const r=S.recurring.find(x=>x.id==d.id);r.active=!r.active;render()};
A.delRec=d=>confirmBox('Delete this recurring expense? Posted expenses stay.',()=>{S.recurring=S.recurring.filter(r=>r.id!=d.id);render()});
A.editRec=d=>{const r=d.id?S.recurring.find(x=>x.id==d.id):{cat:'Rent',day:1,start:T.slice(0,7),active:true};openModal(d.id?'Edit recurring expense':'New recurring expense',`${fi('Description','desc',r.desc,'text','required')}<div class="row2">${fs('Category','cat',sopts(EXPCAT,r.cat))}${fi('Amount','amt',r.amt,'number','min="0.01" step="0.01" required')}</div><div class="row2">${fi('Day of month (1–28)','day',r.day,'number','min="1" max="28" required')}${fi('Starts','start',r.start,'month','required')}</div>`,{onSubmit:f=>{f.amt=+f.amt;f.day=+f.day;if(d.id)Object.assign(r,f);else S.recurring.push({id:uid(),active:true,posted:[],...f});const n=runRecurring();toast('Saved'+(n?' · '+n+' expense posted':''));render()}})};

/* ---------- toasts ---------- */
function toast(m,t=''){
 const root=$('#toast-root');root.setAttribute('aria-live','polite');
 const e=document.createElement('div');e.className='toast '+t;e.setAttribute('role',t?'alert':'status');
 e.innerHTML=ic(t?'alert':'check')+`<span class="tx">${esc(m)}</span><button type="button" class="tc" aria-label="Dismiss">${ic('x')}</button>`;
 const kill=()=>{e.classList.add('out');setTimeout(()=>e.remove(),200)};
 e.querySelector('.tc').onclick=kill;root.appendChild(e);while(root.children.length>4)root.firstChild.remove();setTimeout(kill,t?5200:3200)}

/* ---------- dialogs & drawers ---------- */
let _lastFocus=null;
function closeModal(){const r=$('#modal-root');if(!r||!r.firstChild)return;r.innerHTML='';try{_lastFocus?.focus?.()}catch(e){}_lastFocus=null}
function errMsg(el){const v=el.validity;if(v.valueMissing)return'This field is required';if(v.typeMismatch)return el.type==='email'?'Enter a valid email address':'Enter a valid value';if(v.rangeUnderflow)return'Must be at least '+el.min;if(v.rangeOverflow)return'Must be at most '+el.max;if(v.patternMismatch)return'Check the format';return el.validationMessage||'Invalid value'}
function clearErr(el){if(!el||!el.classList)return;el.classList.remove('bad');el.removeAttribute('aria-invalid');const p=el.closest('.fld')||el.parentNode;p&&p.querySelectorAll(':scope>.ferr').forEach(x=>x.remove())}
function showErr(el){el.classList.add('bad');el.setAttribute('aria-invalid','true');const m=document.createElement('small');m.className='ferr';m.setAttribute('role','alert');m.textContent=errMsg(el);(el.closest('.fld')||el.parentNode).appendChild(m)}
function validate(f){let first=null;f.querySelectorAll('input,select,textarea').forEach(el=>{clearErr(el);if(el.disabled||el.type==='hidden'||el.offsetParent===null)return;if(!el.checkValidity()){showErr(el);first=first||el}});if(first){first.focus();return false}return true}
function openModal(title,body,o={}){
 const drawer=!(o.center||title==='Please confirm');
 if(!$('#modal-root').firstChild)_lastFocus=document.activeElement;
 const plain=String(title).replace(/<[^>]*>/g,'');
 $('#modal-root').innerHTML=`<div class="overlay ${drawer?'drawer':''}" data-a="closeBg"><form role="dialog" aria-modal="true" aria-label="${esc(plain)}" class="modal ${o.wide?'wide':''}" id="mform" novalidate><div class="mhead"><h3>${title}</h3><button type="button" class="icon-btn" data-a="closeModal" aria-label="Close">${ic('x')}</button></div><div class="mbody">${body}</div>${o.footer===false?'':`<div class="mfoot"><button type="button" class="btn ghost" data-a="closeModal">Cancel</button><button class="btn" id="msub">${o.submit||'Save'}</button></div>`}</form></div>`;
 const f=$('#mform');
 setTimeout(()=>f.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=file]),select,textarea')?.focus(),60);
 f.addEventListener('input',e=>clearErr(e.target));f.addEventListener('change',e=>clearErr(e.target));
 f.onsubmit=e=>{e.preventDefault();if(!validate(f))return;const b=$('#msub');
  const run=()=>{if(b){b.classList.remove('loading');b.disabled=false}
   if(o.onSubmit){if(o.onSubmit(Object.fromEntries(new FormData(f)),f)!==false)closeModal()}else closeModal()};
  if(b){b.classList.add('loading');b.disabled=true;setTimeout(run,170)}else run()}}
function confirmBox(msg,fn,label='Delete'){openModal('Please confirm',`<p style="margin:0;font-size:14px">${msg}</p>`,{submit:label,onSubmit:()=>{fn()}})}

/* ---------- small chart helpers ---------- */
const cmpct=n=>n<0?'-'+cmpct(-n):n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':String(Math.round(n));
function spark(v){if(v.length<2)return'';const w=92,h=34,mx=Math.max(...v,1),mn=Math.min(...v,0),sp=mx-mn||1;const pts=v.map((x,i)=>[i/(v.length-1)*w,h-3-(x-mn)/sp*(h-8)]);
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function delta(cur,prev,label){if(!prev&&!cur)return'';let p;if(!prev)return `<span class="dl up">New</span><span>${label}</span>`;p=Math.round((cur-prev)/prev*100);
 return `<span class="dl ${p>0?'up':p<0?'dn':'eq'}">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p)}%</span><span>${label}</span>`}
function deltaN(cur,prev,label){const d=cur-prev;return `<span class="dl ${d>0?'up':d<0?'dn':'eq'}">${d>0?'▲ +':d<0?'▼ ':'• '}${d}</span><span>${label}</span>`}
function lineChart(pts,fmt){ /* pts:[{l,v,tip}] */
 const W=640,H=230,L=44,R=10,Tp=14,B=28,mx0=Math.max(...pts.map(p=>p.v),1),q=mx0/4,mag=Math.pow(10,Math.floor(Math.log10(q))),nz=fmt?Math.max(1,Math.ceil(q)):[1,1.5,2,2.5,3,4,5,6,8,10].find(z=>z*mag>=q-1e-9)*mag,mx=nz*4;
 const x=i=>L+(pts.length>1?i/(pts.length-1):.5)*(W-L-R),y=v=>Tp+(1-v/mx)*(H-Tp-B);
 const line=pts.map((p,i)=>{if(!i)return `M${x(0).toFixed(1)} ${y(p.v).toFixed(1)}`;const a=x(i-1),b=x(i),m=(a+b)/2;return `C${m.toFixed(1)} ${y(pts[i-1].v).toFixed(1)} ${m.toFixed(1)} ${y(p.v).toFixed(1)} ${b.toFixed(1)} ${y(p.v).toFixed(1)}`}).join('');
 const bw=(W-L-R)/Math.max(pts.length-1,1);
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C5CFA" stop-opacity=".28"/><stop offset="1" stop-color="#7C5CFA" stop-opacity="0"/></linearGradient></defs>
 ${[0,1,2,3,4].map(k=>{const v=mx/4*k,yy=y(v);return `<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${fmt?fmt(v,1):cmpct(v)}</text>`}).join('')}
 <path class="area" d="${line} L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B} Z"/><path class="ln" d="${line}"/>
 ${pts.map((p,i)=>`<g class="hv" data-tip="${esc(p.tip)}" data-x="${(x(i)/W*100).toFixed(2)}" data-y="${(y(p.v)/H*100).toFixed(2)}"><rect x="${x(i)-bw/2}" y="0" width="${bw}" height="${H-B}"/><line class="gd" x1="${x(i)}" x2="${x(i)}" y1="${Tp}" y2="${H-B}"/><circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="4.5"/></g>${pts.length<=16||i%Math.ceil(pts.length/10)===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${p.l}</text>`:''}`).join('')}
 </svg><div class="ctip" role="status"></div></div>`}
document.addEventListener('mouseover',e=>{const g=e.target.closest?.('.chart .hv');if(!g)return;const c=g.closest('.chart'),t=c.querySelector('.ctip');t.innerHTML=g.dataset.tip;t.style.left=g.dataset.x+'%';t.style.top=g.dataset.y+'%';t.style.opacity=1});
document.addEventListener('mouseout',e=>{const c=e.target.closest?.('.chart');if(c&&!c.contains(e.relatedTarget))c.querySelector('.ctip').style.opacity=0});
