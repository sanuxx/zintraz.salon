<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon Management System</title>
<meta name="theme-color" content="#FBF8FC"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%23D9488F%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%279%27 fill=%27%23fff%27/%3E%3C/svg%3E"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Soft modern theme (light default, dark optional) ===== */
:root{
 --primary:#D9488F;--primary-d:#C2387B;--on-primary:#fff;--pgrad:linear-gradient(135deg,#E8559A 0%,#B65BDB 100%);
 --accent-text:#B3306F;--tint:rgba(217,72,143,.10);
 --bg:#FBF8FC;--text:#2B2540;--muted:#756E8C;--card:#fff;--line:#EFE8F3;--head:#F6F1F9;--inp:#fff;--secondary:#E2D9EA;
 --ok:#238765;--warn:#9A6414;--bad:#C93A55;--gold:#D9488F;
 --r:22px;--shadow:0 1px 2px rgba(80,50,110,.04),0 8px 28px rgba(110,70,150,.08);--shadow-lg:0 24px 70px rgba(70,40,100,.22);
 --side:#fff;--topbg:rgba(251,248,252,.78);--focus:0 0 0 4px rgba(217,72,143,.18);
}
[data-theme=dark]{
 --primary:#FF86BD;--primary-d:#FF6FAE;--on-primary:#1B1230;--pgrad:linear-gradient(135deg,#FF8FC2 0%,#C69BFF 100%);
 --accent-text:#FFA3CD;--tint:rgba(255,134,189,.12);
 --bg:#120F1F;--text:#EEEAF7;--muted:#A199B8;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--head:rgba(255,255,255,.07);--inp:rgba(255,255,255,.06);--secondary:rgba(255,255,255,.16);
 --ok:#6FE3AE;--warn:#FFC857;--bad:#FF7A90;--gold:#FF86BD;
 --shadow:0 8px 30px rgba(0,0,0,.28);--shadow-lg:0 30px 80px rgba(0,0,0,.6);--side:rgba(255,255,255,.04);--topbg:rgba(18,15,31,.75);
}
[data-theme=dark] .modal,[data-theme=dark] .drop,[data-theme=dark] .panel{
 --text:#2B2540;--muted:#756E8C;--line:#EFE8F3;--head:#F6F1F9;--secondary:#E2D9EA;--bg:#FBF8FC;--card:#fff;--inp:#fff;
 --ok:#238765;--bad:#C93A55;--warn:#9A6414;--gold:#D9488F;--primary:#D9488F;--on-primary:#fff;--accent-text:#B3306F;--tint:rgba(217,72,143,.10);
 background:#fff;color:var(--text)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;min-height:100vh;
 background-image:radial-gradient(900px 500px at 8% -10%,rgba(255,196,225,.55) 0%,transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(205,190,255,.45) 0%,transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(255,226,206,.45) 0%,transparent 60%);background-attachment:fixed}
[data-theme=dark] body{background-image:radial-gradient(900px 500px at 8% -10%,rgba(255,111,174,.14) 0%,transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(124,77,255,.16) 0%,transparent 60%)}
h1,h2,h3,h4{margin:0;font-weight:500}
button{font-family:inherit}
select option{color:#2B2540;background:#fff}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* --- shell: sidebar + main --- */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow-y:auto;z-index:50}
[data-theme=dark] .side{backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.brand b{font-size:16px;font-weight:600;letter-spacing:.005em;line-height:1.25}
.logo{width:40px;height:40px;border-radius:14px;background:var(--pgrad);display:grid;place-items:center;color:var(--on-primary);flex:none;overflow:hidden;box-shadow:0 6px 16px rgba(217,72,143,.28)}
.logo img{width:100%;height:100%;object-fit:cover}
.navpill{display:flex;flex-direction:column;gap:2px}
.navpill a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.navpill a span{display:inline}
.navpill a:hover{background:var(--head);color:var(--text)}
.navpill a.on{background:var(--tint);color:var(--accent-text);font-weight:600;position:relative}
.navpill a.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--pgrad)}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:12px;border-radius:16px;background:var(--head);line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 36px;position:sticky;top:0;z-index:30;background:var(--topbg);backdrop-filter:blur(14px)}
.top .menu-btn{display:none}
.tright{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-left:auto}
.gs{position:relative;flex:1;max-width:420px}
.gs input{padding-left:42px;border-radius:30px;width:100%;height:44px}
.gs>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;pointer-events:none}
.gs .drop{min-width:320px;right:auto}
.drop{position:absolute;top:calc(100% + 8px);left:0;right:0;border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:8px;z-index:40;max-height:380px;overflow:auto;animation:pop .16s}
.drop.right{left:auto;right:0;width:340px}
.drop .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer;font-size:13px}
.drop .it:hover{background:var(--head)}
.drop .it small{color:var(--muted);display:block}
.drop .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:8px 12px 2px}
.spacer{flex:1}
.icon-btn{background:none;border:0;color:var(--text);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--head)}
.tright .icon-btn{border:1px solid var(--line);background:var(--card);width:42px;height:42px;box-shadow:var(--shadow)}
.badge{position:absolute;top:-3px;right:-3px;background:var(--pgrad);color:var(--on-primary);font-size:10px;font-weight:600;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.role-sw select{width:auto;padding:9px 32px 9px 16px;font-size:12px;border-radius:30px;height:42px}
.me{display:flex;align-items:center;gap:10px;cursor:pointer;padding:3px 14px 3px 3px;border:1px solid var(--line);border-radius:30px;background:var(--card);box-shadow:var(--shadow);transition:transform .15s}
.me:hover{transform:translateY(-1px)}
.me small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.me>svg{color:var(--muted);width:16px}
.av{width:36px;height:36px;border-radius:50%;background:var(--head);display:grid;place-items:center;font-weight:500;font-size:13px;flex:none;color:var(--text)}
.av.rose{background:var(--pgrad);color:var(--on-primary)}
.av.lg{width:64px;height:64px;font-size:22px}
.content{padding:18px 36px 80px;width:100%;max-width:1400px;margin:0 auto;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.page-head h1{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}

/* --- surfaces --- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;border:1px solid var(--line)}
[data-theme=dark] .card{backdrop-filter:blur(12px)}
.card h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card h3 svg{color:var(--primary)}
.card.flush{padding:0;overflow:hidden;border-radius:24px}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 1fr}
.stat{display:flex;gap:16px;align-items:center}
.stat .ic{width:52px;height:52px;border-radius:18px;background:var(--tint);display:grid;place-items:center;color:var(--primary);flex:none}
.stat .ic.gold{background:var(--pgrad);color:var(--on-primary);box-shadow:0 8px 20px rgba(217,72,143,.28)}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.015em}
.stat em{font-style:normal;font-size:11.5px;color:var(--muted)}
.btn{background:var(--pgrad);color:var(--on-primary);border:0;padding:11px 22px;border-radius:30px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s,filter .15s;white-space:nowrap;box-shadow:0 6px 18px rgba(217,72,143,.28)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 10px 24px rgba(217,72,143,.34)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;border:1px solid var(--secondary);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--head);filter:none;box-shadow:none}
.btn.gold{background:var(--text);color:var(--bg);box-shadow:none}
.btn.sm{padding:7px 15px;font-size:12px}
.btn.danger{background:transparent;border:1px solid rgba(201,58,85,.4);color:var(--bad);box-shadow:none}
.btn.danger:hover{background:rgba(201,58,85,.08);filter:none;box-shadow:none}
.btn svg{width:16px;height:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tools input,.tools select{width:auto;min-width:170px}
input,select,textarea{width:100%;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--inp);border:1.5px solid var(--secondary);border-radius:14px;padding:11px 15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:var(--focus)}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{color-scheme:dark}
[data-theme=dark] .modal input,[data-theme=dark] .modal select,[data-theme=dark] .modal textarea,[data-theme=dark] .drop input{color-scheme:light}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
table{width:100%;border-collapse:collapse;background:transparent}
th{background:var(--head);text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:13px 20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
td{padding:15px 20px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--head)}
.tw{overflow-x:auto}
.r{text-align:right}
.acts{display:flex;gap:4px;justify-content:flex-end}
.acts .icon-btn{width:32px;height:32px}
.acts .icon-btn svg{width:16px;height:16px}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st-Pending,.p-warn{background:#FFF0CC;color:#7A5200}
.st-Confirmed,.p-info{background:#FFDDEE;color:#8A1F55}
.st-Completed,.p-ok{background:#D9E8FF;color:#1D4A85}
.st-Cancelled,.p-bad{background:#E8E6EF;color:#5B5670}
.p-red{background:#FFD9DE;color:#9B2538}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tabs{display:inline-flex;gap:2px;background:var(--head);border-radius:30px;padding:4px;margin-bottom:22px;max-width:100%;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 20px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;border-radius:24px;transition:.15s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--card);color:var(--accent-text);font-weight:600;box-shadow:0 2px 10px rgba(110,70,150,.14)}
[data-theme=dark] .tabs button.on{background:var(--pgrad);color:var(--on-primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--secondary);background:var(--card);border-radius:30px;padding:7px 16px;font-size:12.5px;cursor:pointer;color:var(--text);transition:.15s}
.chip:hover{border-color:var(--primary)}
.chip.on{background:var(--pgrad);border-color:transparent;color:var(--on-primary);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.bars .b i{display:block;width:100%;max-width:44px;background:linear-gradient(#F7A6CD,#E0529A);border-radius:14px 14px 6px 6px;min-height:4px;transition:filter .15s}
.bars .b:hover i{filter:brightness(1.08)}
.bars .b.today i{background:linear-gradient(#C99BFF,#8E58E0)}
.hb{margin-bottom:14px}
.hb div:first-child{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.hb .tr{height:8px;background:var(--head);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--pgrad);border-radius:6px}
.alert{background:#FFF6DD;border:1px solid #F5DFA5;color:#7A5200;border-radius:16px;padding:12px 18px;margin-bottom:18px;display:flex;gap:10px;align-items:center;font-size:13px}
.alert.lime{background:#FFE9F3;border-color:#F8C3DC;color:#9B2A5E}
[data-theme=dark] .alert{background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.32);color:#FFD884}
[data-theme=dark] .alert.lime{background:rgba(255,134,189,.1);border-color:rgba(255,134,189,.3);color:#FFC2DE}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.svc{transition:transform .18s,box-shadow .18s}
.svc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.svc h4{font-size:15px;margin:6px 0 4px}
.svc .price{font-size:24px;font-weight:600;color:var(--accent-text)}
.svc .price s{font-size:13px;color:var(--muted);font-weight:400;margin-right:6px}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);font-weight:600}
.offer{background:var(--pgrad);color:var(--on-primary);font-size:11px;font-weight:600;padding:3px 11px;border-radius:12px;float:right}
.person{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(135px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.cal.n5{grid-template-columns:repeat(5,minmax(155px,1fr))}
.col{background:var(--card);border-radius:20px;border:1px solid var(--line);min-height:250px;padding:14px;box-shadow:var(--shadow)}
.col.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),0 10px 30px rgba(217,72,143,.14)}
.col h5{margin:0 0 10px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.col h5 b{display:block;font-size:22px;color:var(--text);font-weight:600;letter-spacing:-.01em;text-transform:none}
.ev{border-radius:12px;padding:8px 11px;margin-bottom:7px;font-size:12px;cursor:pointer;border-left:3px solid;transition:transform .12s,box-shadow .12s}
.ev:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(110,70,150,.14)}
.ev b{display:block;font-weight:600}
.ev.s-Pending{background:#FFF4D6;border-color:#F0B429}
.ev.s-Confirmed{background:#FFE8F2;border-color:#E8559A}
.ev.s-Completed{background:#E4EEFF;border-color:#5B8DEF}
.ev.s-Cancelled{background:var(--head);border-color:#A59FB8;opacity:.65;text-decoration:line-through}
[data-theme=dark] .ev.s-Pending{background:rgba(255,200,87,.14)}[data-theme=dark] .ev.s-Confirmed{background:rgba(255,134,189,.14)}[data-theme=dark] .ev.s-Completed{background:rgba(120,170,255,.14)}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.sticky{position:sticky;top:96px}
.tot{display:flex;justify-content:space-between;padding:5px 0}
.tot.big{font-size:20px;font-weight:600;border-top:1px dashed var(--secondary);margin-top:8px;padding-top:12px}
.overlay{position:fixed;inset:0;background:rgba(43,30,66,.45);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{border-radius:28px;width:min(520px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .2s}
.modal.wide{width:min(780px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:17px;font-weight:600}
.mbody{padding:22px 26px;overflow:auto}
.mfoot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--head);border-radius:0 0 28px 28px}
#toast-root{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--text);color:var(--bg);padding:12px 20px;border-radius:30px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:pop .22s;display:flex;gap:10px;align-items:center}
[data-theme=dark] .toast{background:#fff;color:#2B2540}
.toast svg{color:#FF9CCB}
[data-theme=dark] .toast svg{color:#D9488F}
.toast.err{background:#D6334F;color:#fff}.toast.err svg{color:#fff}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .box{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:32px;box-shadow:var(--shadow-lg);padding:44px 40px;width:min(430px,100%);text-align:center}
.login .logo{margin:0 auto 16px;width:64px;height:64px;border-radius:22px}
.login h1{font-size:24px;font-weight:600;letter-spacing:-.015em}
.login p{color:var(--muted);margin:6px 0 24px;font-size:13.5px}
.login .fld{text-align:left}
.login .btn{width:100%;justify-content:center;padding:14px}
.quick{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.invoice{font-size:13px}
.invoice .ih{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;align-items:flex-start}
.invoice hr{border:0;border-top:1px dashed var(--secondary);margin:14px 0}
.hours{display:grid;grid-template-columns:90px 60px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
.pane{display:none}.pane.on{display:block}
.scrim{display:none}

@media(max-width:1100px){
 .g4{grid-template-columns:repeat(2,1fr)}.g21,.split{grid-template-columns:1fr}.sticky{position:static}.g3{grid-template-columns:repeat(2,1fr)}
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow-lg);background:var(--card)}
 [data-theme=dark] .side{background:#1A1530}
 .shell.menu-open .side{transform:none}
 .shell.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(43,30,66,.4);z-index:45}
 .top .menu-btn{display:grid}
 .navpill a.on::before{left:-16px}
 .top{padding:12px 20px}.content{padding:8px 20px 80px}
}
@media(max-width:700px){.me div,.role-sw{display:none}.g12{grid-template-columns:1fr}.page-head h1{font-size:26px}.gs{max-width:none}.tright{gap:8px}.gs .drop{min-width:0;right:0}}

 const pop=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5),pm=pop[0]?.[1]||1;

 return head('Good day, '+esc(S.ui.user.name.split(' ')[0])+' ✨',fdate(T)+' — here\'s how the salon is doing',allowed('appointments')?`<button class="btn" data-a="newAppt">${ic('plus')}New appointment</button>`:'')+
 `<div class="grid g3" style="margin-bottom:18px">${st('cal',"Today's appointments",tap.filter(a=>a.status!=='Cancelled').length,tap.filter(a=>a.status==='Completed').length+' completed')}
 ${st('users',"Today's customers",tc,'unique clients today')}
 ${admin?st('card',"Today's sales",money(salesT),S.invoices.filter(i=>i.date===T).length+' invoices','gold'):st('clock','Pending today',tap.filter(a=>a.status==='Pending').length,'awaiting confirmation','gold')}
 ${admin?st('trend','Monthly revenue',money(rev),'since the 1st','gold')+st('wallet','Total expenses',money(exp),'this month')+st('chart','Net profit',money(rev-exp),rev?Math.round((rev-exp)/rev*100)+'% margin':'')
 :st('check','Completed this month',S.appts.filter(a=>a.date.startsWith(mo)&&a.status==='Completed').length,'appointments','gold')+st('alert','Low-stock items',lowStock().length,'need reordering')+st('user','Team on duty',S.staff.length-S.leaves.filter(l=>inRange(T,l.from,l.to)&&l.status==='Approved').length,'of '+S.staff.length)}</div>
 <div class="grid g21" style="margin-bottom:18px"><div class="card"><h3>${ic('trend')}Revenue — last 7 days</h3><div class="bars">${days.map((d,i)=>`<div class="b ${d===T?'today':''}" title="${fdate(d)}: ${money(vals[i])}"><span>${admin?money(vals[i]).replace(/\.00$/,''):''}</span><i style="height:${vals[i]/mx*75+2}%"></i>${fdow(d)}</div>`).join('')}</div></div>
 <div class="card"><h3>${ic('scissors')}Popular services <small class="muted" style="font-weight:600">30 days</small></h3>${pop.map(p=>`<div class="hb"><div><span>${esc(p[0])}</span><b style="font-weight:500">${p[1]}</b></div><div class="tr"><i style="width:${p[1]/pm*100}%"></i></div></div>`).join('')||empty('No data')}</div></div>
 <div class="grid g21"><div class="card flush"><div style="padding:18px 20px 0"><h3>${ic('clock')}Upcoming appointments</h3></div><div class="tw"><table><thead><tr><th>When</th><th>Customer</th><th>Service</th><th>Staff</th><th>Status</th></tr></thead><tbody>${up.map(a=>`<tr><td>${a.date===T?'Today':fdow(a.date)+', '+fdate(a.date).slice(0,-6)} · ${t12(a.time)}</td><td>${esc(cname(a.custId))}</td><td>${esc(svc(a.svcId).name)}</td><td>${esc(stf(a.staffId).name)}</td><td>${apStatusPill(a.status)}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>${ic('alert')}Low stock alerts</h3>${lowStock().map(p=>`<div class="tot"><span>${esc(p.name)}</span><span class="pill p-red">${p.stock} left</span></div>`).join('')||empty('Stock levels look good')}</div></div>`};

 if(t==='sched'){const mo=monday(T);b=`<div class="card flush tw"><table><thead><tr><th>Staff</th>${[...Array(7)].map((_,i)=>`<th>${fdow(addDays(mo,i))} ${fday(addDays(mo,i))}</th>`).join('')}</tr></thead><tbody>${S.staff.map(s=>`<tr><td><b style="font-weight:500">${esc(s.name)}</b><div class="small muted">${esc(s.role)}</div></td>${[...Array(7)].map((_,i)=>{const d=addDays(mo,i),w=fdow(d),n=S.appts.filter(a=>a.staffId==s.id&&a.date===d&&a.status!=='Cancelled').length;
  return `<td>${onLeave(s,d)?'<span class="pill p-bad">On leave</span>':!s.days.includes(w)?'<span class="muted small">Day off</span>':`<span class="small">${t12(s.from)}–${t12(s.to)}</span><br><span class="pill p-info">${n} booking${n===1?'':'s'}</span>`}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
 if(t==='att')b=`<div class="card flush tw"><table><thead><tr><th>Staff</th><th>Today</th><th>Check-in</th><th>Check-out</th><th>Present (30d)</th><th></th></tr></thead><tbody>${S.staff.map(s=>{const a=S.attendance[s.id],lv=onLeave(s,T);return `<tr><td>${esc(s.name)}</td><td>${lv?'<span class="pill p-bad">On leave</span>':a?(a.out?'<span class="pill p-info">Left</span>':'<span class="pill p-ok">Present</span>'):'<span class="pill p-warn">Not in yet</span>'}</td><td>${a?.in?t12(a.in):'—'}</td><td>${a?.out?t12(a.out):'—'}</td><td>${s.present} days</td><td>${acts(lv?'':!a?`<button class="btn sm" data-a="chkIn" data-id="${s.id}">Check in</button>`:!a.out?`<button class="btn ghost sm" data-a="chkOut" data-id="${s.id}">Check out</button>`:'')}</td></tr>`}).join('')}</tbody></table></div>`;

 if(t==='perf')b=`<div class="card flush tw"><table><thead><tr><th>Staff</th><th>Services (month)</th><th>Revenue</th><th>Rating</th><th>Commission</th></tr></thead><tbody>${S.staff.map(s=>{const c=commission(s.id,m,T),n=sum(live().filter(i=>i.date>=m),i=>sum(i.items.filter(x=>x.type==='svc'&&x.staffId==s.id),x=>x.qty));return `<tr><td>${esc(s.name)}</td><td>${n}</td><td>${money(c.rev)}</td><td>★ ${rate(s)}</td><td><b style="font-weight:500">${money(c.com)}</b> <span class="muted small">(${s.commission}%)</span></td></tr>`}).join('')}</tbody></table></div>`;

const REPS=[['daily','Daily sales'],['monthly','Monthly sales'],['service','Service-wise sales'],['product','Product sales'],['appt','Appointments'],['customer','Customers'],['staff','Staff performance'],['comm','Staff commission'],['expense','Expenses'],['profit','Profit'],['stock','Stock']];
function report(k,a,b){const inv=live().filter(i=>inRange(i.date,a,b));const g=(arr,f)=>{const o={};arr.forEach(x=>{const key=f(x);(o[key]=o[key]||[]).push(x)});return o};
 switch(k){
 case 'daily':{const o=g(inv,i=>i.date);const r=Object.keys(o).sort().reverse().map(d=>[fdate(d),o[d].length,money(sum(o[d],i=>sum(i.items.filter(x=>x.type==='svc'),x=>x.qty*x.price))),money(sum(o[d],i=>sum(i.items.filter(x=>x.type==='prod'),x=>x.qty*x.price))),money(sum(o[d],i=>i.disc)),money(sum(o[d],i=>i.tax)),money(sum(o[d],i=>i.total))]);
  return{cols:['Date','Invoices','Services','Products','Discounts','Tax','Total'],rows:r,sum:[['Total sales',money(sum(inv,i=>i.total))],['Invoices',inv.length],['Avg / day',money(sum(inv,i=>i.total)/Math.max(1,r.length))]]}}
 case 'monthly':{const o=g(inv,i=>i.date.slice(0,7));return{cols:['Month','Invoices','Subtotal','Discounts','Tax','Total'],rows:Object.keys(o).sort().reverse().map(m=>[m,o[m].length,money(sum(o[m],i=>i.sub)),money(sum(o[m],i=>i.disc)),money(sum(o[m],i=>i.tax)),money(sum(o[m],i=>i.total))]),sum:[['Total sales',money(sum(inv,i=>i.total))]]}}
 case 'service':{const o=g(inv.flatMap(i=>i.items.filter(x=>x.type==='svc')),x=>x.name);const r=Object.entries(o).map(([n,l])=>[n,sum(l,x=>x.qty),sum(l,x=>x.qty*x.price)]).sort((x,y)=>y[2]-x[2]);return{cols:['Service','Times sold','Revenue'],rows:r.map(x=>[x[0],x[1],money(x[2])]),sum:[['Service revenue',money(sum(r,x=>x[2]))],['Services performed',sum(r,x=>x[1])]]}}
 case 'product':{const o=g(inv.flatMap(i=>i.items.filter(x=>x.type==='prod')),x=>x.ref);const r=Object.entries(o).map(([id,l])=>{const p=prod(id),q=sum(l,x=>x.qty),rev=sum(l,x=>x.qty*x.price);return[p?p.name:l[0].name,q,rev,rev-(p?p.cost*q:0)]}).sort((x,y)=>y[2]-x[2]);return{cols:['Product','Units sold','Revenue','Gross profit'],rows:r.map(x=>[x[0],x[1],money(x[2]),money(x[3])]),sum:[['Product revenue',money(sum(r,x=>x[2]))],['Gross profit',money(sum(r,x=>x[3]))]]}}
 case 'appt':{const l=S.appts.filter(x=>inRange(x.date,a,b)).sort(apSort).reverse();const c=s=>l.filter(x=>x.status===s).length;return{cols:['Date','Time','Customer','Service','Staff','Status'],rows:l.map(x=>[fdate(x.date),t12(x.time),cname(x.custId),svc(x.svcId).name,stf(x.staffId).name,x.status]),sum:[['Total',l.length],['Completed',c('Completed')],['Pending / Confirmed',c('Pending')+c('Confirmed')],['Cancelled',c('Cancelled')],['No-shows',c('No-show')]]}}
 case 'customer':{const r=S.customers.map(c=>{const iv=inv.filter(i=>i.custId==c.id);return[c.name,iv.length,sum(iv,i=>i.total),sum(iv,i=>i.total-paid(i)),iv.map(i=>i.date).sort().pop()]}).sort((x,y)=>y[2]-x[2]);return{cols:['Customer','Visits','Spent','Outstanding','Last visit'],rows:r.map(x=>[x[0],x[1],money(x[2]),money(x[3]),fdate(x[4])]),sum:[['Active customers',r.filter(x=>x[1]).length],['Total spent',money(sum(r,x=>x[2]))]]}}
 case 'staff':{const r=S.staff.map(s=>{const n=sum(inv,i=>sum(i.items.filter(x=>x.type==='svc'&&x.staffId==s.id),x=>x.qty));const ca=S.appts.filter(x=>x.staffId==s.id&&inRange(x.date,a,b)&&x.status==='Cancelled').length;return[s.name,s.role,n,commission(s.id,a,b).rev,ca,rate(s)]});return{cols:['Staff','Role','Services','Revenue','Cancellations','Rating'],rows:r.map(x=>[x[0],x[1],x[2],money(x[3]),x[4],'★ '+x[5]]),sum:[['Services performed',sum(r,x=>x[2])],['Team revenue',money(sum(r,x=>x[3]))]]}}
 case 'comm':{const r=S.staff.map(s=>{const c=commission(s.id,a,b);return[s.name,c.rev,s.commission,c.com]});return{cols:['Staff','Service revenue','Rate','Commission'],rows:r.map(x=>[x[0],money(x[1]),x[2]+'%',money(x[3])]),sum:[['Total commission',money(sum(r,x=>x[3]))]]}}
 case 'expense':{const l=S.expenses.filter(e=>inRange(e.date,a,b)).sort((x,y)=>y.date.localeCompare(x.date));return{cols:['Date','Category','Description','Amount'],rows:l.map(e=>[fdate(e.date),e.cat,e.desc,money(e.amt)]),sum:[['Total expenses',money(sum(l,e=>e.amt))]]}}
 case 'profit':{const ms=[...new Set([...inv.map(i=>i.date.slice(0,7)),...S.expenses.filter(e=>inRange(e.date,a,b)).map(e=>e.date.slice(0,7))])].sort().reverse();const r=ms.map(m=>{const rv=sum(inv.filter(i=>i.date.startsWith(m)),i=>i.total),ex=sum(S.expenses.filter(e=>e.date.startsWith(m)&&inRange(e.date,a,b)),e=>e.amt);return[m,rv,ex,rv-ex,rv?Math.round((rv-ex)/rv*100)+'%':'—']});return{cols:['Month','Revenue','Expenses','Net profit','Margin'],rows:r.map(x=>[x[0],money(x[1]),money(x[2]),money(x[3]),x[4]]),sum:[['Revenue',money(sum(r,x=>x[1]))],['Expenses',money(sum(r,x=>x[2]))],['Net profit',money(sum(r,x=>x[3]))]]}}
 case 'stock':{return{cols:['Product','Category','In stock','Min','Value at cost','Status'],rows:S.products.map(p=>[p.name,p.cat,p.stock,p.min,money(p.stock*p.cost),p.stock<=p.min?'Low stock':'OK']),sum:[['Stock value',money(sum(S.products,p=>p.stock*p.cost))],['Low-stock items',lowStock().length]]}}}}
P.reports=()=>{const u=S.ui,r=report(u.repKey,u.repFrom,u.repTo),noRange=u.repKey==='stock';

 `<div class="split" style="grid-template-columns:230px 1fr"><div class="card" style="padding:10px">${REPS.map(x=>`<div class="it" style="padding:9px 12px;border-radius:10px;cursor:pointer;${u.repKey===x[0]?'background:var(--head);font-weight:500':''}" data-a="repKey" data-k="${x[0]}">${x[1]}</div>`).join('')}</div>
 <div><div class="tools">${noRange?'':`<label class="small muted">From <input type="date" value="${u.repFrom}" data-ch="repFrom"></label><label class="small muted">To <input type="date" value="${u.repTo}" data-ch="repTo"></label>`}<div class="chips">${noRange?'':[['7','7 days'],['30','30 days'],['90','90 days']].map(x=>`<span class="chip" data-a="repRange" data-n="${x[0]}">${x[1]}</span>`).join('')}</div></div>
 <div class="grid g3" style="margin-bottom:16px;gap:12px">${r.sum.map(s=>`<div class="card" style="padding:14px 18px"><small class="muted">${s[0]}</small><br><b style="font-size:20px;font-weight:500">${s[1]}</b></div>`).join('')}</div>
 <div class="card flush tw"><table><thead><tr>${r.cols.map((c,i)=>`<th class="${i>=r.cols.length-(['daily','monthly','profit','service','product','comm','customer'].includes(u.repKey)?r.cols.length-1:0)&&i>0&&['daily','monthly','profit','service','product','comm'].includes(u.repKey)?'r':''}">${c}</th>`).join('')}</tr></thead><tbody>${r.rows.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${r.cols.length}">${empty('No data for this period')}</td></tr>`}</tbody></table></div></div></div>`};
A.repKey=d=>{S.ui.repKey=d.k;render()};CH.repFrom=e=>{S.ui.repFrom=e.value;render()};CH.repTo=e=>{S.ui.repTo=e.value;render()};

/* conflicts */
function apptConflict(f,id){
 if(inactive(f))return'';
 const c=S.appts.find(x=>x.id!=id&&x.staffId==f.staffId&&x.date===f.date&&!inactive(x)&&overlap(f.time,f.dur,x.time,x.dur));
 if(c)return stf(f.staffId).name+' is already booked at '+t12(c.time);
 if(onLeaveOn(stf(f.staffId),f.date))return stf(f.staffId).name+' is on leave that day';
 if(f.resId&&busyRes(f.resId,f.date,f.time,f.dur,id))return S.resources.find(r=>r.id==f.resId).name+' is already in use at that time';
 return''}

document.addEventListener('dragover',e=>{const c=e.target.closest?.('[data-drop-date]');if(c&&dragId){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('[data-drop-date]')?.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest?.('[data-drop-date]');if(!c||!dragId)return;e.preventDefault();c.classList.remove('over');moveAppt(dragId,c.dataset.dropDate,c.dataset.dropStaff);dragId=null});

function moveAppt(id,date,staffId){const a=S.appts.find(x=>x.id==id);if(!a)return;
 const n={...a,date,staffId:staffId?+staffId:a.staffId};
 if(n.date===a.date&&n.staffId===a.staffId)return;
 if(n.resId&&busyRes(n.resId,n.date,n.time,n.dur,id)){const r=freeRes(svc(n.svcId).cat,n.date,n.time,n.dur,id)[0];n.resId=r?r.id:''}
 const m=apptConflict(n,id);if(m){toast(m,'err');return}
 Object.assign(a,n);delete S.reminded[id];toast('Moved to '+fdow(date)+' '+fdate(date).slice(0,-6)+' · '+stf(a.staffId).name);render()}

 <div class="row3" style="align-items:end"><label class="fld"><span>Service</span><select id="bSvc">${opts(S.services,'',x=>x.id,x=>`${x.name} — ${money(x.price*(1-x.disc/100))}`)}</select></label><label class="fld"><span>Staff</span><select id="bStf">${opts(S.staff,'')}</select></label><div class="fld"><button type="button" class="btn" data-a="bAddSvc">${ic('plus')}Add service</button></div></div>

 <div class="card sticky"><h3>${ic('card')}Payment summary</h3><div class="tot"><span>Subtotal</span><span>${money(c.sub)}</span></div>
 <div class="row2" style="margin:8px 0 0"><label class="fld"><span>Discount</span><input type="number" min="0" step="0.01" value="${d.discVal}" data-ch="bDisc"></label><label class="fld"><span>Type</span><select data-ch="bDiscT"><option value="%" ${d.discType==='%'?'selected':''}>Percent %</option><option value="$" ${d.discType==='$'?'selected':''}>Amount</option></select></label></div>

 <div class="chips" style="margin-bottom:8px">${d.voucher?`<span class="chip on">Voucher ${esc(d.voucher.code)} <a data-a="bUnV" style="cursor:pointer">✕</a></span>`:''}${d.g?`<span class="chip on">Gift card ${esc(d.g.code)} · ${money(d.g.balance)} <a data-a="bUnG" style="cursor:pointer">✕</a></span>`:''}</div>

 <div class="row2" style="margin-top:14px"><label class="fld"><span>Payment method</span><select data-ch="bMethod">${sopts(METHODS,d.method)}</select></label><label class="fld"><span>Amount received</span><input type="number" min="0" step="0.01" value="${pay.toFixed(2)}" data-ch="bPay"></label></div>
 <div class="tot"><span>Balance due</span><b style="font-weight:500;color:${c.due-pay>.005?'var(--bad)':'var(--ok)'}">${money(Math.max(0,c.due-pay))}</b></div>
 ${cu?`<div class="small muted" style="margin:6px 0">Earns <b>${earnPts(cu,c.total)}</b> loyalty points</div>`:''}${ft('Notes','notes',d.notes,'data-ch="bNotes"')}

CH.bCust=e=>{S.draft.custId=e.value;S.draft.redeem=0;render()};CH.bDisc=e=>{S.draft.discVal=+e.value;render()};CH.bDiscT=e=>{S.draft.discType=e.value;render()};CH.bMethod=e=>{S.draft.method=e.value;render()};CH.bPay=e=>{S.draft.pay=e.value;render()};CH.bNotes=e=>{S.draft.notes=e.value};CH.bRedeem=e=>{S.draft.redeem=+e.value||0;S.draft.pay='';render()};
A.bAddSvc=()=>{const s=svc($('#bSvc').value),pk=$('#bPkg')?.value,d=S.draft;
 if(pk){const p=S.pkgs.find(x=>x.id==pk);if(p.svcId!==s.id){toast('That package covers '+svc(p.svcId).name,'err');return}
  if(p.total-p.used-d.items.filter(i=>i.pkgUse==p.id).length<=0){toast('No sessions left on that package','err');return}
  d.items.push({type:'svc',ref:s.id,name:s.name+' (package)',qty:1,price:0,staffId:+$('#bStf').value,pkgUse:p.id})}
 else d.items.push({type:'svc',ref:s.id,name:s.name,qty:1,price:+(s.price*(1-s.disc/100)).toFixed(2),staffId:+$('#bStf').value});
 d.pay='';render()};
A.bAddProd=()=>{const p=prod($('#bProd').value),q=Math.max(1,+$('#bQty').value||1),ex=S.draft.items.find(i=>i.type==='prod'&&i.ref===p.id);
 if((ex?ex.qty:0)+q>p.stock){toast('Only '+p.stock+' in stock','err');return}if(ex)ex.qty+=q;else S.draft.items.push({type:'prod',ref:p.id,name:p.name,qty:q,price:p.price});S.draft.pay='';render()};
A.bQty=d=>{const it=S.draft.items[d.i];if(it.pkgUse)return;it.qty=Math.max(1,it.qty+ +d.n);if(it.type==='prod'&&it.qty>prod(it.ref).stock){it.qty=prod(it.ref).stock;toast('Stock limit reached','err')}S.draft.pay='';render()};
A.bDel=d=>{S.draft.items.splice(d.id,1);S.draft.pay='';render()};
A.bClear=()=>{S.draft=newDraft();render()};
A.bApply=()=>{const code=$('#bCode').value.trim().toUpperCase();if(!code)return;const d=S.draft,g=gcard(code);
 if(g){if(gcStatus(g)[0]!=='Active'){toast('Gift card is '+gcStatus(g)[0].toLowerCase(),'err');return}d.gift=g.code;d.pay='';toast('Gift card applied · balance '+money(g.balance));render();return}
 const v=S.vouchers.find(x=>x.code===code);
 if(!v){toast('Code not recognised','err');return}
 if(!v.active||v.expires<T||v.uses>=v.max){toast('Voucher is no longer valid','err');return}
 d.voucher={code:v.code,type:v.type,value:v.value};d.pay='';toast('Voucher applied');render()};
A.bScan=()=>{const l=[...S.giftcards.filter(g=>gcStatus(g)[0]==='Active').map(g=>g.code),...S.vouchers.filter(v=>v.active&&v.expires>=T&&v.uses<v.max).map(v=>v.code)];if(!l.length)return;S.ui.scanI=((S.ui.scanI||0)+1)%l.length;$('#bCode').value=l[S.ui.scanI];A.bApply()};
A.bUnV=()=>{S.draft.voucher=null;S.draft.pay='';render()};A.bUnG=()=>{S.draft.gift=null;S.draft.pay='';render()};
A.bSave=()=>{const d=S.draft;if(!d.items.length){toast('Add at least one service or product','err');return}
 const c=draftCalc(),pay=Math.min(c.due,d.pay===''?c.due:+d.pay||0),cu=c.c;
 const pays=[];if(c.gift>0)pays.push({method:'Gift card',amt:+c.gift.toFixed(2),date:T,code:c.g.code});if(pay>0)pays.push({method:d.method,amt:+pay.toFixed(2),date:T});
 const earned=earnPts(cu,c.total);
 const inv={id:uid(),no:S.settings.invPrefix+(1000+S.invoices.length+1),custId:d.custId?+d.custId:null,apptId:d.apptId,date:T,items:d.items.map(x=>({...x})),sub:c.sub,disc:c.disc,tax:c.tax,total:c.total,payments:pays,returned:false,notes:d.notes,pts:earned,redeemedPts:c.usedPts,voucher:d.voucher?.code||''};
 inv.items.forEach(i=>{if(i.type==='prod')prod(i.ref).stock-=i.qty;if(i.pkgUse)S.pkgs.find(p=>p.id==i.pkgUse).used++});
 if(c.gift>0){c.g.balance=+(c.g.balance-c.gift).toFixed(2);c.g.history.push({date:T,text:'Redeemed on '+inv.no,amt:-c.gift})}
 if(d.voucher)S.vouchers.find(v=>v.code===d.voucher.code).uses++;
 if(cu){cu.points=cu.points-c.usedPts+earned;cu.lifetime+=earned}
 if(d.apptId){const a=S.appts.find(x=>x.id==d.apptId);if(a){a.status='Completed';a.serviceDone=false}}
 S.invoices.push(inv);S.draft=newDraft();toast('Bill saved — '+inv.no+(earned?' · +'+earned+' pts':''));render();showInvoice(inv.id)};
function billHist(){const q=S.ui.invQ.toLowerCase();const l=S.invoices.filter(i=>!q||i.no.toLowerCase().includes(q)||cname(i.custId).toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);
 return `<div class="tools"><div class="gs" style="margin:0;max-width:340px;width:100%">${ic('search')}<input placeholder="Search invoice # or customer" value="${esc(S.ui.invQ)}" data-in="invQ"></div></div><div class="card flush tw"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Balance</th><th>Status</th><th></th></tr></thead><tbody id="invBody">${invRows(l)}</tbody></table></div>`}
function invRows(l){return l.slice(0,80).map(i=>{const st=invStatus(i),bal=i.returned?0:i.total-paid(i);return `<tr><td>${i.no}</td><td>${fdate(i.date)}</td><td>${esc(cname(i.custId))}</td><td class="r">${money(i.total)}</td><td class="r">${money(paid(i))}</td><td class="r">${bal>.005?money(bal):'—'}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td>${acts(ib('showInv','eye',i.id,'View / print'),bal>.005?ib('payInv','wallet',i.id,'Record payment'):'',!i.returned?ib('retInv','undo',i.id,'Sales return'):'')}</td></tr>`}).join('')||`<tr><td colspan="8">${empty('No invoices found')}</td></tr>`}
IN.invQ=el=>{S.ui.invQ=el.value;const q=el.value.toLowerCase();$('#invBody').innerHTML=invRows(S.invoices.filter(i=>!q||i.no.toLowerCase().includes(q)||cname(i.custId).toLowerCase().includes(q)).sort((a,b)=>b.id-a.id))};
function printBtn(){$('.mhead').insertAdjacentHTML('beforeend','<button type="button" class="btn sm" style="margin-left:auto;margin-right:8px" onclick="window.print()">'+ic('printer')+'Print</button>');$('.mhead .icon-btn').style.order=2}
function docHead(title,no,date,badge){const s=S.settings;return `<div class="ih"><div style="display:flex;gap:10px;align-items:center"><div class="logo">${s.logo?`<img src="${s.logo}">`:ic('flower')}</div><div><b style="font-size:15px;font-weight:500">${esc(s.name)}</b><div class="muted small">${esc(s.address)}<br>${esc(s.phone)} · ${esc(s.email)}</div></div></div><div style="text-align:right"><b style="letter-spacing:.14em;color:#d6337f;font-weight:500">${title}</b><div class="small">${no}<br>${fdate(date)}</div>${badge||''}</div></div>`}
function showInvoice(id){const i=S.invoices.find(x=>x.id==id),s=S.settings,st=invStatus(i);
 openModal('Invoice '+i.no,`<div class="invoice" id="invoicePrint">${docHead('INVOICE',i.no,i.date,`<span class="pill ${st[1]}">${st[0]}</span>`)}
 <div class="small muted">Billed to</div><b style="font-weight:500">${esc(cname(i.custId))}</b>
 <table style="margin:14px 0"><thead><tr><th>Item</th><th>Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.name)}${x.staffId&&stf(x.staffId)?`<div class="small muted">by ${esc(stf(x.staffId).name)}</div>`:''}</td><td>${x.qty}</td><td class="r">${money(x.price)}</td><td class="r">${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table>
 <div style="margin-left:auto;max-width:270px"><div class="tot"><span>Subtotal</span><span>${money(i.sub)}</span></div>${i.disc?`<div class="tot"><span>Discounts${i.voucher?' ('+esc(i.voucher)+')':''}${i.redeemedPts?' · '+i.redeemedPts+' pts':''}</span><span>−${money(i.disc)}</span></div>`:''}${i.tax?`<div class="tot"><span>Tax</span><span>${money(i.tax)}</span></div>`:''}<div class="tot big"><span>Total</span><span>${money(i.total)}</span></div><div class="tot"><span>Paid</span><span>${money(paid(i))}</span></div>${i.total-paid(i)>.005&&!i.returned?`<div class="tot"><b style="font-weight:500">Balance due</b><b style="font-weight:500;color:var(--bad)">${money(i.total-paid(i))}</b></div>`:''}</div>
 ${i.payments.length?`<hr><div class="small muted">Payments: ${i.payments.map(p=>`${p.method}${p.code?' '+p.code:''} ${money(p.amt)} (${fdate(p.date)})`).join(' · ')}</div>`:''}${i.pts?`<div class="small muted" style="margin-top:4px">Loyalty points earned: <b>${i.pts}</b></div>`:''}<hr><div class="small muted" style="text-align:center">${esc(s.invFooter)}</div></div>`,{wide:true,footer:false});printBtn()}
A.showInv=d=>showInvoice(d.id);
A.payInv=d=>{const i=S.invoices.find(x=>x.id==d.id),bal=i.total-paid(i);openModal('Record payment — '+i.no,`<p class="muted small" style="margin-top:0">Balance due: <b>${money(bal)}</b></p>${fs('Method','method',sopts(METHODS,'Cash'))}${fi('Amount','amt',bal.toFixed(2),'number',`min="0.01" max="${bal.toFixed(2)}" step="0.01" required`)}`,{submit:'Record payment',onSubmit:f=>{i.payments.push({method:f.method,amt:Math.min(+f.amt,bal),date:T});toast('Payment recorded');render()}})};
/* returns -> credit notes */
A.retInv=d=>{const i=S.invoices.find(x=>x.id==d.id),amt=paid(i);
 openModal('Sales return — '+i.no,`<p style="margin-top:0">Customer: <b>${esc(cname(i.custId))}</b><br>Amount paid: <b>${money(amt)}</b></p>${fs('Reason','reason',sopts(['Unhappy with service','Product defect / wrong item','Booked by mistake','Other'],''))}${fs('Refund as','method',sopts(['Cash','Card','Gift card (new balance)'],'Cash'))}<p class="muted small">Products are restocked, loyalty points reversed, and a credit note is issued.</p>`,
 {submit:'Issue credit note',onSubmit:f=>{
  i.returned=true;i.items.forEach(x=>{if(x.type==='prod')prod(x.ref).stock+=x.qty;if(x.pkgUse){const p=S.pkgs.find(z=>z.id==x.pkgUse);if(p&&p.used>0)p.used--}});
  const cu=cust(i.custId);if(cu){cu.points=Math.max(0,cu.points-(i.pts||0)+(i.redeemedPts||0));cu.lifetime=Math.max(0,cu.lifetime-(i.pts||0))}
  if(i.apptId){const a=S.appts.find(z=>z.id==i.apptId);if(a)a.status='Cancelled'}
  const cn={id:uid(),no:'CN-'+(1000+S.creditNotes.length+1),invId:i.id,invNo:i.no,date:T,custId:i.custId,items:i.items.map(x=>({...x})),amount:amt,method:f.method.startsWith('Gift')?'Gift card':f.method,reason:f.reason};
  if(cn.method==='Gift card'){const g={id:uid(),code:gcCode(),amount:amt,balance:amt,recipient:cname(i.custId),buyer:'Credit note '+cn.no,issued:T,expires:addDays(T,365),history:[{date:T,text:'Issued from '+cn.no,amt}]};S.giftcards.push(g);cn.gc=g.code}
  S.creditNotes.push(cn);toast('Credit note '+cn.no+' issued');render();setTimeout(()=>showCN(cn.id),0)}})};

 <table style="margin:14px 0"><thead><tr><th>Item</th><th>Qty</th><th class="r">Amount</th></tr></thead><tbody>${c.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td class="r">${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table>
 <div style="margin-left:auto;max-width:270px"><div class="tot big"><span>Refunded</span><span>${money(c.amount)}</span></div><div class="tot"><span>Method</span><span>${c.method}${c.gc?' · '+c.gc:''}</span></div></div><hr><div class="small muted">Reason: ${esc(c.reason)}</div></div>`,{wide:true,footer:false});printBtn()}

function drawerTab(){const dw=S.drawers.find(x=>x.date===T),hist=S.drawers.filter(x=>x!==dw).slice().reverse();let top='';
 if(!dw)top=`<div class="card" style="max-width:420px;margin-bottom:18px"><h3>${ic('wallet')}Open today's drawer</h3><form data-f2="drawerOpen">${fi('Opening float','float',S.drawers.length?S.drawers[S.drawers.length-1].counted||150:150,'number','min="0" step="0.01" required')}<button class="btn">Open drawer</button></form></div>`;
 else{const sales=cashIn(T),mv=sum(dw.moves||[],m=>m.type==='in'?m.amt:-m.amt),ref=cashRef(T),exp=drawerExpected(dw);
  top=`<div class="grid g4" style="margin-bottom:18px">${[['Opening float',dw.float],['Cash sales today',sales],['Cash in / out',mv],['Cash refunds',-ref]].map(x=>`<div class="card"><small class="muted">${x[0]}</small><div class="big">${money(x[1])}</div></div>`).join('')}</div>

 const pn=k=>`class="pane ${tab===k?'on':''}" data-pane="${k}"`;
 openModal('Customer profile',`<div style="display:flex;gap:16px;align-items:center;margin-bottom:16px"><div class="av lg rose">${ini(c.name)}</div><div style="flex:1"><h3 style="font-size:18px">${esc(c.name)} ${tierPill(c)}${ns>=2?` <span class="pill p-red">⚠ ${ns} no-shows</span>`:''}</h3><div class="muted small">${esc(c.phone)} · ${esc(c.email)}</div><div class="muted small">Born ${fdate(c.dob)} · Client since ${fdate(c.joined)}</div></div><button type="button" class="btn sm" data-a="apptFor" data-id="${c.id}">${ic('cal')}Book</button></div>
 <div class="grid g4" style="margin-bottom:16px;gap:10px">${[['Visits',s.visits],['Total spent',money(s.spent)],['Balance due',`<span style="color:${s.due>.005?'var(--bad)':'inherit'}">${money(s.due)}</span>`],['Loyalty points',c.points]].map(x=>`<div class="card" style="padding:12px;text-align:center"><small class="muted">${x[0]}</small><br><b style="font-weight:500">${x[1]}</b></div>`).join('')}</div>
 ${tabs([['a','Appointments'],['s','Services'],['p','Payments'],['l','Loyalty & packages'],['g','Photos & formulas'],['n','Notes']],tab,'ptab')}
 <div ${pn('a')}><div class="tw"><table><thead><tr><th>Date</th><th>Service</th><th>Staff</th><th>Status</th></tr></thead><tbody>${ap.map(a=>`<tr><td>${fdate(a.date)} ${t12(a.time)}</td><td>${esc(svc(a.svcId).name)}</td><td>${esc(stf(a.staffId).name)}</td><td>${apStatusPill(a.status)}</td></tr>`).join('')||`<tr><td colspan="4">${empty('No appointments yet')}</td></tr>`}</tbody></table></div></div>
 <div ${pn('s')}><div class="tw"><table><thead><tr><th>Date</th><th>Service</th><th>Performed by</th><th class="r">Price</th></tr></thead><tbody>${done.map(x=>`<tr><td>${fdate(x.d)}</td><td>${esc(x.n)}</td><td>${esc(x.s)}</td><td class="r">${money(x.p)}</td></tr>`).join('')||`<tr><td colspan="4">${empty('No service history')}</td></tr>`}</tbody></table></div></div>
 <div ${pn('p')}><div class="tw"><table><thead><tr><th>Invoice</th><th>Date</th><th class="r">Total</th><th class="r">Paid</th><th>Status</th></tr></thead><tbody>${inv.map(i=>{const st=invStatus(i);return `<tr><td>${i.no}</td><td>${fdate(i.date)}</td><td class="r">${money(i.total)}</td><td class="r">${money(paid(i))}</td><td><span class="pill ${st[1]}">${st[0]}</span></td></tr>`}).join('')||`<tr><td colspan="5">${empty('No payments yet')}</td></tr>`}</tbody></table></div></div>
 <div ${pn('l')}><div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">${tierPill(c)}<b style="font-weight:500;font-size:18px">${c.points} pts</b><span class="muted small">worth ${money(c.points/L.redeemPts*L.redeemVal)} · ${c.lifetime} lifetime</span><span class="spacer"></span><button type="button" class="btn sm ghost" data-a="adjPts" data-id="${c.id}">Adjust</button></div>${nx?`<div class="prog" style="margin-top:12px;width:100%"><i style="width:${Math.min(100,(c.lifetime-t.min)/(nx.min-t.min)*100)}%"></i></div><div class="small muted" style="margin-top:4px">${nx.min-c.lifetime} pts to ${nx.name} (×${nx.mult} points)</div>`:''}</div>
 <h4 style="margin:14px 0 8px">Packages</h4>${pk.map(p=>`<div class="card" style="margin-bottom:8px;padding:12px"><div class="mrow" style="display:flex;justify-content:space-between"><b style="font-weight:500">${esc(p.name)}</b><span class="small muted">expires ${fdate(p.expires)}</span></div><div class="prog" style="width:100%;margin:8px 0 4px"><i style="width:${p.used/p.total*100}%"></i></div><span class="small muted">${p.total-p.used} of ${p.total} sessions left</span></div>`).join('')||'<div class="muted small">No packages purchased.</div>'}</div>
 <div ${pn('g')}><div class="card" style="margin-bottom:14px"><div class="row3" style="align-items:end"><label class="fld"><span>Type</span><select id="phKind"><option>Before</option><option>After</option></select></label><label class="fld"><span>Caption</span><input id="phCap" placeholder="e.g. Honey balayage"></label><label class="btn" style="cursor:pointer;margin-bottom:12px;justify-content:center">${ic('plus')}Upload photo<input type="file" accept="image/*" data-ch="photoUp" data-id="${c.id}" hidden></label></div></div>
 <div class="gal">${c.photos.map(p=>`<figure><img src="${p.src}" alt=""><button type="button" class="x" data-a="delPhoto" data-id="${c.id}" data-p="${p.id}">×</button><figcaption><span class="pill ${p.kind==='After'?'p-ok':'p-bad'}">${p.kind}</span> ${esc(p.cap)}<br>${fdate(p.date)}</figcaption></figure>`).join('')||'<div class="muted small">No photos yet.</div>'}</div>
 <h4 style="margin:18px 0 8px">Formula notes</h4>${c.formulas.map(f=>`<div class="card" style="margin-bottom:8px;padding:12px"><div style="display:flex;justify-content:space-between"><b style="font-weight:500">${esc(f.svc)}</b><span class="small muted">${fdate(f.date)} · ${esc(f.by)} <a data-a="delFormula" data-id="${c.id}" data-f="${f.id}" style="cursor:pointer;color:var(--bad)">✕</a></span></div><div class="small" style="margin-top:4px">${esc(f.text)}</div></div>`).join('')||'<div class="muted small">No formulas recorded.</div>'}
 <div class="card" style="margin-top:10px"><div class="row2">${fi('Service','','','text','id="fmSvc" list="fmL" placeholder="e.g. Hair Coloring"')}<datalist id="fmL">${S.services.map(x=>`<option>${esc(x.name)}`).join('')}</datalist></div>${ft('Formula / notes','','','id="fmText" placeholder="Shade, developer volume, timings, products…"')}<button type="button" class="btn sm" data-a="addFormula" data-id="${c.id}">Save formula</button></div></div>
 <div ${pn('n')}><textarea id="cnotes" rows="5" placeholder="Allergies, preferences, reminders…">${esc(c.notes)}</textarea><div style="margin-top:10px"><button type="button" class="btn sm" data-a="saveNotes" data-id="${c.id}">Save notes</button></div></div>`,{wide:true,footer:false})};
function readImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}
CH.photoUp=e=>{const f=e.files[0];if(!f)return;const c=cust(e.dataset.id),kind=$('#phKind').value,cap=$('#phCap').value||kind+' photo';readImg(f,src=>{c.photos.push({id:uid(),kind,cap,date:T,src});toast('Photo added');A.profile({id:c.id,tab:'g'})})};
A.delPhoto=d=>{const c=cust(d.id);c.photos=c.photos.filter(p=>p.id!=d.p);A.profile({id:d.id,tab:'g'})};
A.addFormula=d=>{const c=cust(d.id),svc_=$('#fmSvc').value.trim(),text=$('#fmText').value.trim();if(!svc_||!text){toast('Add the service and the formula','err');return}c.formulas.unshift({id:uid(),date:T,svc:svc_,by:S.ui.user.name,text});toast('Formula saved');A.profile({id:c.id,tab:'g'})};
A.delFormula=d=>{const c=cust(d.id);c.formulas=c.formulas.filter(f=>f.id!=d.f);A.profile({id:d.id,tab:'g'})};

/* ---- inventory: suppliers & purchase orders ---- */
const invTabs=()=>tabs([['prod','Products'],['sup','Suppliers'],['po','Purchase orders ('+S.pos.filter(p=>p.status!=='Received').length+' open)']],S.ui.invTab,'invTab');
A.invTab=d=>{S.ui.invTab=d.t;render()};
P.inventory=()=>{const t=S.ui.invTab;
 if(t==='sup')return head('Suppliers','Who you buy from',`<button class="btn" data-a="editSup">${ic('plus')}Add supplier</button>`)+invTabs()+supTab();
 if(t==='po')return head('Purchase orders','Reorder and receive stock',`<button class="btn ghost" data-a="autoPO">${ic('alert')}Reorder low stock</button><button class="btn" data-a="newPO">${ic('plus')}New purchase order</button>`)+invTabs()+poTab();
 return invProducts()};
const poTotal=p=>sum(p.items,i=>i.qty*i.cost),poCls=s=>({Draft:'p-warn',Ordered:'p-info',Partial:'p-warn',Received:'p-ok'}[s]);
const supOf=id=>S.suppliers.find(s=>s.id==id);
function supTab(){return `<div class="card flush tw"><table><thead><tr><th>Supplier</th><th>Contact</th><th>Terms</th><th>Products</th><th>Open POs</th><th></th></tr></thead><tbody>${S.suppliers.map(s=>`<tr><td><b style="font-weight:500">${esc(s.name)}</b></td><td>${esc(s.contact)}<div class="small muted">${esc(s.phone)} · ${esc(s.email)}</div></td><td>${esc(s.terms)}</td><td>${S.products.filter(p=>p.supplierId==s.id).length}</td><td>${S.pos.filter(p=>p.supplierId==s.id&&p.status!=='Received').length}</td><td>${acts(ib('editSup','edit',s.id,'Edit'),ib('delSup','trash',s.id,'Delete'))}</td></tr>`).join('')||`<tr><td colspan="6">${empty('No suppliers')}</td></tr>`}</tbody></table></div>`}
A.editSup=d=>{const s=d.id?supOf(d.id):{terms:'Net 30'};openModal(d.id?'Edit supplier':'Add supplier',`${fi('Company','name',s.name,'text','required')}<div class="row2">${fi('Contact person','contact',s.contact)}${fi('Phone','phone',s.phone,'tel')}</div>${fi('Email','email',s.email,'email')}${fi('Payment terms','terms',s.terms)}`,{onSubmit:f=>{if(d.id)Object.assign(s,f);else S.suppliers.push({id:uid(),...f});toast('Supplier saved');render()}})};
A.delSup=d=>confirmBox('Delete this supplier?',()=>{S.suppliers=S.suppliers.filter(s=>s.id!=d.id);S.products.forEach(p=>{if(p.supplierId==d.id)p.supplierId=''});render()});
function poTab(){return `<div class="card flush tw"><table><thead><tr><th>PO</th><th>Supplier</th><th>Ordered</th><th>Expected</th><th>Lines</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>${S.pos.slice().reverse().map(p=>`<tr><td>${p.no}</td><td>${esc(supOf(p.supplierId)?.name||'—')}</td><td>${fdate(p.date)}</td><td>${fdate(p.expected)}</td><td>${p.items.length}</td><td class="r">${money(poTotal(p))}</td><td><span class="pill ${poCls(p.status)}">${p.status}</span></td><td>${acts(ib('viewPO','eye',p.id,'Open'))}</td></tr>`).join('')||`<tr><td colspan="8">${empty('No purchase orders yet — use “Reorder low stock”.')}</td></tr>`}</tbody></table></div>`}
const openQty=pid=>sum(S.pos.filter(p=>p.status!=='Received'),p=>sum(p.items.filter(i=>i.prodId==pid),i=>i.qty-i.received));
function makePOs(lines){const by={};lines.forEach(l=>{const p=prod(l.prodId),sid=p.supplierId||S.suppliers[0]?.id;(by[sid]=by[sid]||[]).push({prodId:p.id,qty:l.qty,cost:p.cost,received:0})});
 const made=Object.entries(by).map(([sid,items])=>{const po={id:uid(),no:'PO-'+(2001+S.pos.length),supplierId:+sid,date:T,expected:addDays(T,5),status:'Draft',items,notes:''};S.pos.push(po);return po});return made}
A.autoPO=()=>{const lines=lowStock().filter(p=>openQty(p.id)<=0).map(p=>({prodId:p.id,qty:Math.max(p.min*3-p.stock,p.min)}));
 if(!lines.length){toast(lowStock().length?'Low-stock items are already on open orders':'Nothing is low on stock');return}
 const m=makePOs(lines);S.ui.invTab='po';toast(m.length+' draft purchase order'+(m.length>1?'s':'')+' created');render()};
A.newPO=()=>openModal('New purchase order',`<p class="muted small" style="margin-top:0">Enter quantities — one order is created per supplier.</p><div class="tw"><table><thead><tr><th>Product</th><th>Supplier</th><th>Stock</th><th>Qty</th></tr></thead><tbody>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="small">${esc(supOf(p.supplierId)?.name||'—')}</td><td>${p.stock}${p.stock<=p.min?' <span class="pill p-red">low</span>':''}</td><td><input type="number" min="0" name="q_${p.id}" value="${p.stock<=p.min&&openQty(p.id)<=0?Math.max(p.min*3-p.stock,p.min):0}" style="width:80px;padding:6px 8px"></td></tr>`).join('')}</tbody></table></div>`,{wide:true,submit:'Create order(s)',onSubmit:f=>{const lines=S.products.map(p=>({prodId:p.id,qty:+f['q_'+p.id]||0})).filter(l=>l.qty>0);if(!lines.length){toast('Enter at least one quantity','err');return false}const m=makePOs(lines);toast(m.length+' purchase order(s) created');render()}});
A.viewPO=d=>{const p=S.pos.find(x=>x.id==d.id);
 openModal('Purchase order '+p.no,`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><b style="font-weight:500">${esc(supOf(p.supplierId)?.name||'—')}</b><span class="pill ${poCls(p.status)}">${p.status}</span><span class="spacer"></span><span class="muted small">Expected ${fdate(p.expected)}</span></div>
 <div class="tw"><table><thead><tr><th>Product</th><th class="r">Qty</th><th class="r">Cost</th><th class="r">Received</th><th class="r">Line</th></tr></thead><tbody>${p.items.map(i=>`<tr><td>${esc(prod(i.prodId)?.name||'(deleted)')}</td><td class="r">${i.qty}</td><td class="r">${money(i.cost)}</td><td class="r">${i.received}</td><td class="r">${money(i.qty*i.cost)}</td></tr>`).join('')}</tbody></table></div><div class="tot big"><span>Total</span><span>${money(poTotal(p))}</span></div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${p.status==='Draft'?`<button type="button" class="btn" data-a="poOrder" data-id="${p.id}">Mark as ordered</button><button type="button" class="btn danger" data-a="poDel" data-id="${p.id}">Delete</button>`:''}${p.status==='Ordered'||p.status==='Partial'?`<button type="button" class="btn" data-a="poReceive" data-id="${p.id}">Receive stock</button>`:''}</div>`,{footer:false})};
A.poOrder=d=>{const p=S.pos.find(x=>x.id==d.id);p.status='Ordered';p.date=T;closeModal();toast(p.no+' marked as ordered (supplier emailed — demo)');render()};
A.poDel=d=>{S.pos=S.pos.filter(x=>x.id!=d.id);closeModal();render()};
A.poReceive=d=>{const p=S.pos.find(x=>x.id==d.id);
 openModal('Receive stock — '+p.no,`<div class="tw"><table><thead><tr><th>Product</th><th class="r">Ordered</th><th class="r">Received so far</th><th>Receive now</th></tr></thead><tbody>${p.items.map((i,k)=>`<tr><td>${esc(prod(i.prodId)?.name||'')}</td><td class="r">${i.qty}</td><td class="r">${i.received}</td><td><input type="number" name="r${k}" min="0" max="${i.qty-i.received}" value="${i.qty-i.received}" style="width:90px;padding:6px 8px"></td></tr>`).join('')}</tbody></table></div><label class="chip" style="margin-top:14px"><input type="checkbox" name="exp" checked> Record as a “Product Purchases” expense</label>`,{wide:true,submit:'Receive',onSubmit:f=>{let cost=0;
  p.items.forEach((i,k)=>{const q=Math.min(i.qty-i.received,+f['r'+k]||0);if(q>0){i.received+=q;cost+=q*i.cost;const pr=prod(i.prodId);if(pr){pr.stock+=q;pr.cost=i.cost}}});
  p.status=p.items.every(i=>i.received>=i.qty)?'Received':'Partial';
  if(f.exp&&cost>0)S.expenses.push({id:uid(),date:T,cat:'Product Purchases',desc:'Stock received · '+p.no,amt:+cost.toFixed(2)});
  toast('Stock updated · '+p.no+' '+p.status.toLowerCase());render()}})};

/* ---- recurring expenses ---- */
function runRecurring(){let n=0;S.recurring.filter(r=>r.active).forEach(r=>{for(let m=r.start;m<=T.slice(0,7);m=nextMonth(m)){const dt=m+'-'+String(Math.min(r.day,28)).padStart(2,'0');if(dt<=T&&!r.posted.includes(m)){S.expenses.push({id:uid(),date:dt,cat:r.cat,desc:r.desc+' (auto)',amt:r.amt});r.posted.push(m);n++}}});return n}
function recTab(){const nxt=r=>{let m=T.slice(0,7);if(m+'-'+String(Math.min(r.day,28)).padStart(2,'0')<=T||r.posted.includes(m))m=nextMonth(m);return fdate(m+'-'+String(Math.min(r.day,28)).padStart(2,'0'))};
 return `<div class="tools"><button class="btn" data-a="editRec">${ic('plus')}New recurring expense</button><button class="btn ghost" data-a="runRec">Post due items now</button><span class="muted small">Items post themselves on their day each month.</span></div><div class="card flush tw"><table><thead><tr><th>Description</th><th>Category</th><th class="r">Amount</th><th>Day</th><th>Next posting</th><th>Status</th><th></th></tr></thead><tbody>${S.recurring.map(r=>`<tr><td>${esc(r.desc)}</td><td><span class="pill p-info">${esc(r.cat)}</span></td><td class="r">${money(r.amt)}</td><td>${r.day}</td><td>${r.active?nxt(r):'—'}</td><td><span class="pill ${r.active?'p-ok':'p-bad'}">${r.active?'Active':'Paused'}</span></td><td>${acts(ib('togRec','check',r.id,r.active?'Pause':'Resume'),ib('editRec','edit',r.id,'Edit'),ib('delRec','trash',r.id,'Delete'))}</td></tr>`).join('')||`<tr><td colspan="7">${empty('No recurring expenses')}</td></tr>`}</tbody></table></div>`}
A.runRec=()=>{const n=runRecurring();toast(n?n+' expense'+(n>1?'s':'')+' posted':'Nothing due right now');render()};
A.togRec=d=>{const r=S.recurring.find(x=>x.id==d.id);r.active=!r.active;render()};
A.delRec=d=>confirmBox('Delete this recurring expense? Posted expenses stay.',()=>{S.recurring=S.recurring.filter(r=>r.id!=d.id);render()});
A.editRec=d=>{const r=d.id?S.recurring.find(x=>x.id==d.id):{cat:'Rent',day:1,start:T.slice(0,7),active:true};openModal(d.id?'Edit recurring expense':'New recurring expense',`${fi('Description','desc',r.desc,'text','required')}<div class="row2">${fs('Category','cat',sopts(EXPCAT,r.cat))}${fi('Amount','amt',r.amt,'number','min="0.01" step="0.01" required')}</div><div class="row2">${fi('Day of month (1–28)','day',r.day,'number','min="1" max="28" required')}${fi('Starts','start',r.start,'month','required')}</div>`,{onSubmit:f=>{f.amt=+f.amt;f.day=+f.day;if(d.id)Object.assign(r,f);else S.recurring.push({id:uid(),active:true,posted:[],...f});const n=runRecurring();toast('Saved'+(n?' · '+n+' expense posted':''));render()}})};

/* ---- settings: rooms & equipment ---- */
function resTab(){return `<div class="tools"><button class="btn" data-a="editRes">${ic('plus')}Add room / equipment</button></div><div class="card flush tw"><table><thead><tr><th>Name</th><th>Type</th><th>Used for</th><th></th></tr></thead><tbody>${S.resources.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${r.cats.map(c=>`<span class="pill p-info">${esc(c)}</span>`).join(' ')}</td><td>${acts(ib('editRes','edit',r.id,'Edit'),ib('delRes','trash',r.id,'Delete'))}</td></tr>`).join('')||`<tr><td colspan="4">${empty('No rooms yet')}</td></tr>`}</tbody></table></div><p class="muted small">Appointments reserve a matching room/chair automatically, so two clients are never booked into the same one.</p>`}
A.editRes=d=>{const r=d.id?S.resources.find(x=>x.id==d.id):{type:'Room',cats:[]};openModal(d.id?'Edit resource':'Add resource',`${fi('Name','name',r.name,'text','required')}${fs('Type','type',sopts(['Room','Chair','Station','Studio','Equipment'],r.type))}<span class="small muted">Suitable for</span><div class="chips" style="margin-top:6px">${catList().map(c=>`<label class="chip"><input type="checkbox" name="c_${esc(c)}" ${r.cats.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}</div>`,{onSubmit:f=>{const cats=catList().filter(c=>f['c_'+c]);const n={name:f.name,type:f.type,cats};if(d.id)Object.assign(r,n);else S.resources.push({id:uid(),...n});toast('Saved');render()}})};
A.delRes=d=>confirmBox('Delete this room / equipment?',()=>{S.resources=S.resources.filter(r=>r.id!=d.id);S.appts.forEach(a=>{if(a.resId==d.id)a.resId=''});render()});

/* ---------- boot ---------- */
(function(){const p=location.hash.replace('#/','');if(NAV.some(n=>n[0]===p&&p!=='app'))S.ui.page=p;runRecurring();renderShell();
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body>
</html>
